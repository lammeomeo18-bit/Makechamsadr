/* ═══════════ tiện ích ═══════════ */
const $ = s => document.querySelector(s);
const hx = n => n.toString(16);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const a4 = n => (n + 3) & ~3;

const CRC_TAB = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
const crc32 = b => {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) c = CRC_TAB[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
};
const enc = s => new TextEncoder().encode(s);

/* ═══════════ LZ4 ═══════════ */
function lz4dec(src, outSize){
  const dst = new Uint8Array(outSize);
  const n = src.length;
  let i = 0, o = 0;
  while (i < n){
    const tok = src[i++];

    let lit = tok >> 4;
    if (lit === 15){
      let b;
      do { if (i >= n) throw new Error('LZ4: hết dữ liệu ở độ dài literal'); b = src[i++]; lit += b; }
      while (b === 255);
    }
    if (lit){
      if (i + lit > n) throw new Error('LZ4: literal vượt biên');
      if (o + lit > outSize) throw new Error('LZ4: literal vượt kích thước đầu ra');
      dst.set(src.subarray(i, i + lit), o);
      i += lit; o += lit;
    }

    /* token cuối chỉ có literal, không kèm match */
    if (i >= n) break;

    const off = src[i] | (src[i+1] << 8); i += 2;
    if (off === 0 || off > o) throw new Error(`LZ4: offset không hợp lệ (${off})`);
    let ml = tok & 15;
    if (ml === 15){
      let b;
      do { if (i >= n) throw new Error('LZ4: hết dữ liệu ở độ dài match'); b = src[i++]; ml += b; }
      while (b === 255);
    }
    ml += 4;
    if (o + ml > outSize) throw new Error('LZ4: match vượt kích thước đầu ra');
    /* copy từng byte — vùng match có thể chồng lấn khi off < ml */
    let sp = o - off;
    for (let k = 0; k < ml; k++) dst[o++] = dst[sp++];
  }
  if (o !== outSize) throw new Error(`LZ4: giải ra ${o} byte, cần ${outSize}`);
  return dst;
}

/* Nén LZ4 block kiểu LZ4HC (parse tối ưu bằng quy hoạch động) */
function lz4enc(src, hi){
  const n = src.length;
  if (!n) return new Uint8Array(0);
  const MFLIMIT = 12, LASTLIT = 5, MAXDIST = 65535, HLOG = 16;
  /* hi = true: tìm sâu tối đa, cho ra đúng dung lượng của LZ4HC gốc (chậm hơn) */
  const DEPTH = hi ? 65536 : 1024, SUFF = hi ? 1e9 : 64, TRY = hi ? 4096 : 128;
  const out = [];
  const pushLen = r => { while (r >= 255){ out.push(255); r -= 255; } out.push(r); };
  const emit = (ls, le, mlen, moff) => {
    const litlen = le - ls, ml = mlen ? mlen - 4 : 0;
    out.push(((litlen >= 15 ? 15 : litlen) << 4) | (ml >= 15 ? 15 : ml));
    if (litlen >= 15) pushLen(litlen - 15);
    for (let k = ls; k < le; k++) out.push(src[k]);
    if (mlen){ out.push(moff & 255, (moff >> 8) & 255); if (ml >= 15) pushLen(ml - 15); }
  };
  const limitPos = n - MFLIMIT;           // vị trí cuối cùng được phép bắt đầu match: < limitPos
  if (limitPos <= 0){ emit(0, n, 0, 0); return new Uint8Array(out); }

  const head = new Int32Array(1 << HLOG).fill(-1);
  const prev = new Int32Array(n).fill(-1);
  const h4 = i => (Math.imul((src[i] | (src[i+1]<<8) | (src[i+2]<<16) | (src[i+3]<<24)) >>> 0, 2654435761) >>> (32 - HLOG));
  const mLen = new Int32Array(n), mOff = new Int32Array(n);
  let inserted = 0;
  for (let i = 0; i < limitPos; i++){
    while (inserted < i){ const hk = h4(inserted); prev[inserted] = head[hk]; head[hk] = inserted; inserted++; }
    const maxL = n - LASTLIT - i;
    let bl = 0, bo = 0;
    /* kéo dài match của vị trí trước (rất nhanh với đoạn lặp dài) */
    if (i > 0 && mLen[i-1] > SUFF){ bl = mLen[i-1] - 1; bo = mOff[i-1]; }
    else {
      let cur = head[h4(i)], cnt = 0;
      while (cur >= 0 && cnt < DEPTH){
        const off = i - cur;
        if (off > MAXDIST) break;
        if (src[cur+bl] === src[i+bl] && src[cur] === src[i] && src[cur+1] === src[i+1] && src[cur+2] === src[i+2] && src[cur+3] === src[i+3]){
          let l = 4;
          while (l < maxL && src[cur+l] === src[i+l]) l++;
          if (l > bl){ bl = l; bo = off; if (l >= maxL || l >= 4096) break; }
        }
        cur = prev[cur]; cnt++;
      }
    }
    if (bl > maxL) bl = maxL;
    if (bl >= 4){ mLen[i] = bl; mOff[i] = bo; }
  }

  const INF = 0x3fffffff;
  const price = new Int32Array(n + 1).fill(INF), lit = new Int32Array(n + 1);
  const pPos = new Int32Array(n + 1).fill(-1), pLen = new Int32Array(n + 1);
  price[0] = 0;
  const mcost = l => { const m = l - 4; return 3 + (m >= 15 ? 1 + Math.floor((m - 15) / 255) : 0); };
  for (let i = 0; i < n; i++){
    const pi = price[i];
    if (pi >= INF) continue;
    /* thêm 1 literal */
    const nl = lit[i] + 1;
    const lc = pi + 1 + ((nl >= 15 && (nl - 15) % 255 === 0) ? 1 : 0);
    if (lc < price[i+1]){
      price[i+1] = lc; lit[i+1] = nl; pPos[i+1] = i; pLen[i+1] = 0;
    }
    const L = mLen[i];
    if (L >= 4){
      const top = Math.min(L, TRY);
      for (let l = 4; l <= top; l++){
        const c = pi + mcost(l), j = i + l;
        if (c < price[j]){ price[j] = c; lit[j] = 0; pPos[j] = i; pLen[j] = l; }
      }
      if (L > TRY){
        const c = pi + mcost(L), j = i + L;
        if (c < price[j]){ price[j] = c; lit[j] = 0; pPos[j] = i; pLen[j] = L; }
      }
    }
  }
  /* truy ngược */
  const seq = [];
  let pos = n;
  while (pos > 0){
    if (pLen[pos] > 0){ const st = pPos[pos]; seq.push([st, pLen[pos], mOff[st]]); pos = st; }
    else pos--;
  }
  seq.reverse();
  let anchor = 0;
  for (const [st, l, off] of seq){ emit(anchor, st, l, off); anchor = st + l; }
  emit(anchor, n, 0, 0);
  return new Uint8Array(out);
}

/* Truy vết nguồn gốc từng byte của kết quả giải nén.
   - literal  → { src: offset trong luồng nén }
   - match    → { from: vị trí byte đầu ra mà nó sao chép lại }
   Nhờ đó biết được sửa byte nào trong luồng nén để đổi byte đầu ra mong muốn. */
function lz4Trace(src, outSize){
  const litOf  = new Int32Array(outSize).fill(-1);
  const copyOf = new Int32Array(outSize).fill(-1);
  let i = 0, o = 0;
  while (i < src.length && o < outSize){
    const tok = src[i++];
    let lit = tok >> 4;
    if (lit === 15){ let b; do { b = src[i++]; lit += b; } while (b === 255); }
    for (let k = 0; k < lit; k++){ litOf[o++] = i++; }
    if (i >= src.length) break;
    const off = src[i] | (src[i+1] << 8); i += 2;
    let ml = tok & 15;
    if (ml === 15){ let b; do { b = src[i++]; ml += b; } while (b === 255); }
    ml += 4;
    let sp = o - off;
    for (let k = 0; k < ml; k++){ copyOf[o] = sp; o++; sp++; }
  }
  /* Lần về gốc: byte match nào cuối cùng cũng bắt nguồn từ một literal. */
  const root = new Int32Array(outSize).fill(-1);
  for (let k = 0; k < outSize; k++){
    let cur = k, guard = 0;
    while (litOf[cur] < 0 && copyOf[cur] >= 0 && guard++ < outSize) cur = copyOf[cur];
    root[k] = litOf[cur] >= 0 ? litOf[cur] : -1;
  }
  return root;
}

/* ═══════════ UnityFS ═══════════ */
function parseBundle(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let p = 0;
  const cstr = () => { let s = ''; while (u8[p]) s += String.fromCharCode(u8[p++]); p++; return s; };

  const sig = cstr();
  if (sig !== 'UnityFS') throw new Error(`Không phải UnityFS bundle (signature "${sig}")`);
  const fmt = dv.getUint32(p, false); p += 4;
  const uv = cstr(), rev = cstr();
  const declared = Number(dv.getBigInt64(p, false)); p += 8;
  const ciSize = dv.getUint32(p, false); p += 4;
  const uiSize = dv.getUint32(p, false); p += 4;
  const flags  = dv.getUint32(p, false); p += 4;
  const headerEnd = p;
  const ic = flags & 0x3F;

  let infoOff, info, dataStart;
  if (flags & 0x80){
    /* blocksInfoAtTheEnd: blocksInfo nằm cuối phần dữ liệu thực dùng.
       Trường size có thể sai (file còn đuôi thừa) nên dò ngược để tìm.
       Vùng dữ liệu vẫn căn lề 16 sau header, kể cả khi cờ 0x200 không bật. */
    dataStart = (headerEnd + 15) & ~15;
    infoOff = null;
    const from = Math.min(declared, u8.length) - ciSize;
    for (let off = from; off >= Math.max(0, from - 80000); off--){
      try {
        const cand = (ic === 2 || ic === 3)
          ? lz4dec(u8.subarray(off, off + ciSize), uiSize)
          : u8.subarray(off, off + ciSize).slice();
        info = cand; infoOff = off; break;
      } catch (e) { /* thử vị trí trước đó */ }
    }
    if (infoOff === null) throw new Error('Không tìm được blocksInfo ở cuối file.');
  } else {
    if (fmt >= 7 || (flags & 0x200)) p = (p + 15) & ~15;
    infoOff = p;
    const infoRaw = u8.subarray(p, p + ciSize);
    if (ic === 2 || ic === 3) info = lz4dec(infoRaw, uiSize);
    else if (ic === 0) info = infoRaw.slice();
    else throw new Error(`blocksInfo nén kiểu ${ic} (chưa hỗ trợ)`);
    /* sau blocksInfo còn căn lề 16 trước khi vào vùng dữ liệu */
    dataStart = infoOff + ciSize;
    if (flags & 0x200) dataStart = (dataStart + 15) & ~15;
  }

  const idv = new DataView(info.buffer, info.byteOffset, info.byteLength);
  let q = 16;
  const nB = idv.getUint32(q, false); q += 4;
  const blocks = [];
  for (let i = 0; i < nB; i++){
    blocks.push({ u: idv.getUint32(q,false), c: idv.getUint32(q+4,false), f: idv.getUint16(q+8,false) });
    q += 10;
  }
  const nN = idv.getUint32(q, false); q += 4;
  const nodes = [];
  for (let i = 0; i < nN; i++){
    const off = Number(idv.getBigInt64(q,false)), sz = Number(idv.getBigInt64(q+8,false));
    const nf = idv.getUint32(q+16,false); q += 20;
    let nm = ''; while (info[q]) nm += String.fromCharCode(info[q++]); q++;
    nodes.push({ off, size: sz, flags: nf, name: nm });
  }
  return { fmt, uv, rev, declared, ciSize, uiSize, flags, blocks, nodes,
           dataStart, infoOff, info, headerEnd };
}

/* ═══════════ SerializedFile ═══════════ */
function parseSF(cab){
  const dv = new DataView(cab.buffer, cab.byteOffset, cab.byteLength);
  const version = dv.getUint32(8, false);
  if (version !== 22 && version !== 17) throw new Error(`SerializedFile phiên bản ${version} — tool hiện hỗ trợ phiên bản 17 và 22. Game đã đổi định dạng, cần cập nhật tool.`);
  let metaSize, fileSize, dataOffset, p;
  if (version >= 22){
    metaSize = dv.getUint32(20, false);
    fileSize = Number(dv.getBigInt64(24, false));
    dataOffset = Number(dv.getBigInt64(32, false));
    p = 48;
  } else {                                   // v17 (Unity 2018): header 20 byte, trường 32-bit
    metaSize = dv.getUint32(0, false);
    fileSize = dv.getUint32(4, false);
    dataOffset = dv.getUint32(12, false);
    p = 20;
  }
  const NODE_SZ = version >= 19 ? 32 : 24;  // v>=19 có thêm refTypeHash 8 byte
  const cstr = () => { let s=''; while (cab[p]) s += String.fromCharCode(cab[p++]); p++; return s; };
  const unityVer = cstr();
  const target = dv.getInt32(p, true); p += 4;
  const hasTT = cab[p]; p += 1;

  const i32 = () => { const v = dv.getInt32(p, true); p += 4; return v; };
  const u32 = () => { const v = dv.getUint32(p, true); p += 4; return v; };

  const tcount = i32();
  const types = [];
  for (let i = 0; i < tcount; i++){
    const cid = i32();
    p += 1;                              // stripped
    p += 2;                              // scriptTypeIndex
    if (cid === 114) p += 16;            // scriptHash
    const th = cab.slice(p, p+16); p += 16;
    let nodes = null, sb = null;
    if (hasTT){
      const nn = i32(), sbs = i32();
      nodes = [];
      for (let k = 0; k < nn; k++){
        const ver = dv.getUint16(p, true);
        const level = cab[p+2], tflags = cab[p+3];
        const to = dv.getUint32(p+4, true), no = dv.getUint32(p+8, true);
        const bsize = dv.getInt32(p+12, true), idx = dv.getInt32(p+16, true), meta = dv.getInt32(p+20, true);
        p += NODE_SZ;
        nodes.push({ ver, level, tflags, to, no, bsize, idx, meta });
      }
      sb = cab.slice(p, p + sbs); p += sbs;
      if (version >= 21){ const nd = i32(); p += nd * 4; }    // typeDependencies
    }
    types.push({ cid, th, nodes, sb });
  }

  const ocount = i32();
  const objs = [];
  for (let i = 0; i < ocount; i++){
    p = a4(p);
    const ent = p;
    const pid = dv.getBigInt64(p, true);
    let off, size, tid;
    if (version >= 22){
      off = Number(dv.getBigInt64(p+8, true));
      size = dv.getUint32(p+16, true);
      tid = dv.getInt32(p+20, true);
      p += 24;
    } else {                                 // v17: byteStart 32-bit
      off = dv.getUint32(p+8, true);
      size = dv.getUint32(p+12, true);
      tid = dv.getInt32(p+16, true);
      p += 20;
    }
    objs.push({ pid, off, size, tid, cid: types[tid].cid, ent });
  }
  return { version, metaSize, fileSize, dataOffset, unityVer, target, hasTT, types, objs, cab };
}

/* ═══════════ typetree reader ═══════════ */
const COMMON = "AABB\0AnimationClip\0AnimationCurve\0AnimationState\0Array\0Base\0BitField\0bitset\0bool\0char\0ColorRGBA\0Component\0data\0deque\0double\0dynamic_array\0FastPropertyName\0first\0float\0Font\0GameObject\0Generic Mono\0GradientNEW\0GUID\0GUIStyle\0int\0list\0long long\0map\0Matrix4x4f\0MdFour\0MonoBehaviour\0MonoScript\0m_ByteSize\0m_Curve\0m_EditorClassIdentifier\0m_EditorHideFlags\0m_Enabled\0m_ExtensionPtr\0m_GameObject\0m_Index\0m_IsArray\0m_IsStatic\0m_MetaFlag\0m_Name\0m_ObjectHideFlags\0m_PrefabInternal\0m_PrefabParentObject\0m_Script\0m_StaticEditorFlags\0m_Type\0m_Version\0Object\0pair\0PPtr<Component>\0PPtr<GameObject>\0PPtr<Material>\0PPtr<MonoBehaviour>\0PPtr<MonoScript>\0PPtr<Object>\0PPtr<Prefab>\0PPtr<Sprite>\0PPtr<TextAsset>\0PPtr<Texture>\0PPtr<Texture2D>\0PPtr<Transform>\0Prefab\0Quaternionf\0Rectf\0RectInt\0RectOffset\0second\0set\0short\0size\0SInt16\0SInt32\0SInt64\0SInt8\0staticvector\0string\0TextAsset\0TextMesh\0Texture\0Texture2D\0Transform\0TypelessData\0UInt16\0UInt32\0UInt64\0UInt8\0unsigned int\0unsigned long long\0unsigned short\0vector\0Vector2f\0Vector3f\0Vector4f\0m_ScriptingClassIdentifier\0Gradient\0Type*\0int2_storage\0int3_storage\0BoundsInt\0m_CorrespondingSourceObject\0m_PrefabInstance\0m_PrefabAsset\0FileSize\0Hash128\0";
const COMMON_B = enc(COMMON);

function sname(sb, off){
  const buf = (off & 0x80000000) ? COMMON_B : sb;
  let o = off & 0x7fffffff, s = '';
  while (buf[o]) s += String.fromCharCode(buf[o++]);
  return s;
}
function buildNodes(t){
  return t.nodes.map(n => ({
    type: sname(t.sb, n.to), name: sname(t.sb, n.no),
    level: n.level, meta: n.meta
  }));
}

/* Đọc giá trị theo typetree; ghi lại offset của mọi chuỗi vào trace */
function makeReader(data){
  const dv = new DataView(data.buffer, data.byteOffset, data.byteLength);
  return { data, dv, p: 0, align(){ this.p = a4(this.p); } };
}
function readVal(nodes, i, r, trace){
  const n = nodes[i];
  const t = n.type;
  const doAlign = (n.meta & 0x4000) !== 0;
  const kids = [];
  let j = i + 1;
  while (j < nodes.length && nodes[j].level > n.level){
    if (nodes[j].level === n.level + 1) kids.push(j);
    j++;
  }
  let v;
  switch (t){
    case 'SInt8':  v = r.dv.getInt8(r.p);  r.p += 1; break;
    case 'UInt8': case 'char': v = r.data[r.p]; r.p += 1; break;
    case 'SInt16': case 'short': v = r.dv.getInt16(r.p,true); r.p += 2; break;
    case 'UInt16': case 'unsigned short': v = r.dv.getUint16(r.p,true); r.p += 2; break;
    case 'SInt32': case 'int': case 'Type*': v = r.dv.getInt32(r.p,true); r.p += 4; break;
    case 'UInt32': case 'unsigned int': v = r.dv.getUint32(r.p,true); r.p += 4; break;
    case 'SInt64': case 'long long': v = r.dv.getBigInt64(r.p,true); r.p += 8; break;
    case 'UInt64': case 'unsigned long long': case 'FileSize':
      v = r.dv.getBigUint64(r.p,true); r.p += 8; break;
    case 'float':  v = r.dv.getFloat32(r.p,true); r.p += 4; break;
    case 'double': v = r.dv.getFloat64(r.p,true); r.p += 8; break;
    case 'bool':   v = r.data[r.p] !== 0; r.p += 1; break;
    case 'string': {
      const st = r.p;
      const ln = r.dv.getInt32(r.p,true); r.p += 4;
      v = new TextDecoder().decode(r.data.subarray(r.p, r.p+ln)); r.p += ln;
      r.align();
      if (trace) trace.push({ node: n.name, start: st, len: ln, val: v });
      break;
    }
    case 'TypelessData': {
      const ln = r.dv.getInt32(r.p,true); r.p += 4;
      v = r.data.slice(r.p, r.p+ln); r.p += ln;
      break;
    }
    default: {
      if (kids.length && nodes[kids[0]].type === 'Array'){
        const ai = kids[0];
        const ak = [];
        let k = ai + 1;
        while (k < nodes.length && nodes[k].level > nodes[ai].level){
          if (nodes[k].level === nodes[ai].level + 1) ak.push(k);
          k++;
        }
        const size = r.dv.getInt32(r.p,true); r.p += 4;
        v = [];
        for (let m = 0; m < size; m++) v.push(readVal(nodes, ak[1], r, trace));
        if (nodes[ai].meta & 0x4000) r.align();
      } else {
        v = {};
        for (const c of kids) v[nodes[c].name] = readVal(nodes, c, r, trace);
      }
    }
  }
  if (doAlign) r.align();
  return v;
}

function objBody(sf, o){ return sf.cab.subarray(sf.dataOffset + o.off, sf.dataOffset + o.off + o.size); }
function readObj(sf, o, trace){
  const nodes = buildNodes(sf.types[o.tid]);
  const r = makeReader(objBody(sf, o));
  const v = readVal(nodes, 0, r, trace);
  return v;
}

/* ═══════════ PRESET 1: tráo bone_Hips ⇄ bone_Neck ═══════════ */
const HIPS = enc('bone_Hips'), NECK = enc('bone_Neck');
const H_HIPS = crc32(HIPS), H_NECK = crc32(NECK);

function findSwapTargets(u8, from, to){
  const hits = [];
  const want = [
    { nm: HIPS, lb:'bone_Hips', h: H_HIPS, ot: NECK, ol:'bone_Neck', cons:true  },
    { nm: NECK, lb:'bone_Neck', h: H_NECK, ot: HIPS, ol:'bone_Hips', cons:true  },
    { nm: HIPS, lb:'bone_Hips', h: H_NECK, ot: NECK, ol:'bone_Neck', cons:false },
    { nm: NECK, lb:'bone_Neck', h: H_HIPS, ot: HIPS, ol:'bone_Hips', cons:false }
  ];
  for (const w of want){
    const pat = new Uint8Array(20);
    const pv = new DataView(pat.buffer);
    pv.setInt32(0, 9, true);
    pat.set(w.nm, 4);
    pv.setUint32(16, w.h, true);
    for (let i = from; i <= to - 20; i++){
      let ok = true;
      for (let k = 0; k < 20; k++) if (u8[i+k] !== pat[k]) { ok = false; break; }
      if (ok) hits.push({ at: i + 4, ...w });
    }
  }
  return hits.sort((a,b) => a.at - b.at);
}

function applyPreset1(orig, b){
  const node = b.nodes[0];
  if (b.blocks.some(x => (x.f & 0x3F) !== 0))
    throw new Error('Bundle có block bị nén — preset 1 chỉ sửa được bundle lưu thô.');
  const from = b.dataStart + node.off, to = from + node.size;
  const hits = findSwapTargets(orig, from, to);
  if (!hits.length) throw new Error('Không tìm thấy cặp bone_Hips / bone_Neck nào trong file này.');
  const out = orig.slice();
  for (const h of hits) out.set(h.ot, h.at);
  const rows = hits.map(h => [`0x${hx(h.at).padStart(5,'0')}`, String(h.h), h.lb, h.ol]);
  const st = hits.every(h => h.cons) ? 'nguyên bản'
           : hits.every(h => !h.cons) ? 'đã hoán đổi' : 'lẫn lộn';
  return {
    out,
    note: `Tìm thấy <b>${hits.length}</b> mục tiêu (trạng thái trước đó: <b>${st}</b>) — hoán đổi ${hits.length*4} byte.`,
    cols: ['Offset','Hash (CRC32)','Trước','Sau'], rows
  };
}

/* ═══════════ PRESET 2: bone_Head giả + indexer 12 mục ═══════════ */
const MALE_PID = -9165109095992080675n, FEMALE_PID = 2680591970127643204n;
const BACKPACK = 'bone_Left_Spine_Backpack';

/* Sửa một mesh: đổi tên xương Backpack → bone_Head, đặt position + scale */
function patchMesh(sf, o, px, pz, s){
  const trace = [];
  const val = readObj(sf, o, trace);
  const bones = val.meshData.umaBones;
  const names = trace.filter(t => t.node === 'name');
  if (names.length !== bones.length) throw new Error('Không khớp số xương với chuỗi tên.');

  const idx = bones.findIndex(b => b.name === BACKPACK);
  if (idx < 0) return null;                       // mesh này không có
  const tr = names[idx];

  const body = objBody(sf, o);
  const posOff = tr.start - 40;                   // position(12) rotation(16) scale(12) name
  const scOff  = tr.start - 12;

  const oldFieldLen = 4 + tr.len + ((-(4 + tr.len)) & 3);
  const nb = enc('bone_Head');
  const newField = new Uint8Array(4 + nb.length + ((-(4 + nb.length)) & 3));
  new DataView(newField.buffer).setInt32(0, nb.length, true);
  newField.set(nb, 4);

  const out = new Uint8Array(body.length - oldFieldLen + newField.length);
  out.set(body.subarray(0, tr.start), 0);
  out.set(newField, tr.start);
  out.set(body.subarray(tr.start + oldFieldLen), tr.start + newField.length);

  const odv = new DataView(out.buffer);
  const before = { x: bones[idx].position.x, y: bones[idx].position.y, z: bones[idx].position.z,
                   sx: bones[idx].scale.x, sy: bones[idx].scale.y, sz: bones[idx].scale.z };
  if (px !== null) odv.setFloat32(posOff, px, true);
  if (pz !== null) odv.setFloat32(posOff + 8, pz, true);
  odv.setFloat32(scOff,     -s, true);
  odv.setFloat32(scOff + 4,  s, true);
  odv.setFloat32(scOff + 8,  1.0, true);

  return { body: out, idx, before,
           after: { x: px ?? before.x, y: before.y, z: pz ?? before.z, sx: -s, sy: s, sz: 1.0 } };
}

/* Ghi một chuỗi Unity: [int32 độ dài][bytes][đệm căn 4] */
function wstr(s){
  const sb = enc(s);
  const f = new Uint8Array(a4(4 + sb.length));
  new DataView(f.buffer).setInt32(0, sb.length, true);
  f.set(sb, 4);
  return f;
}

/*
  Dựng lại UMAAssetIndexer:
   - Thêm mọi recipe/race có trong bundle mà indexer chưa liệt kê (4 mục _max).
   - Rút gọn _Path để tổng kích thước object khớp đúng `targetSize`,
     nhờ đó dung lượng file cuối bằng đúng bản gốc.
  _Name / _TypeIndex / m_Item (PPtr) giữ nguyên tuyệt đối — runtime chỉ dùng chúng.
*/
function rebuildIndexer(sf, o, known, targetSize){
  const trace = [];
  const val = readObj(sf, o, trace);
  const items = val.Items;
  const paths = trace.filter(t => t.node === '_Path');
  if (paths.length !== items.length) throw new Error('Không khớp số _Path với số mục indexer.');

  /* mục hiện có + mục còn thiếu (đối chiếu theo pathID của object trong bundle) */
  const have = new Set(items.map(it => it.m_Item.m_PathID));
  const added = [];
  for (const k of known){
    if (have.has(k.pid)) continue;
    const sib = items.find(it => it._TypeIndex === k.typeIndex);
    added.push({
      _QualifiedName: '', _TypeIndex: k.typeIndex, _Name: k.name,
      m_Item: { m_FileID: 0, m_PathID: k.pid },
      _Path: sib ? sib._Path.replace(/[^/]+\.asset$/, k.name + '.asset') : k.name + '.asset'
    });
  }
  const all = [...items, ...added].sort((a,b) => a._Name < b._Name ? -1 : a._Name > b._Name ? 1 : 0);

  /* head = mọi thứ trước mảng Items (int32 số mục nằm ngay trước _QualifiedName đầu tiên) */
  const firstQN = trace.find(t => t.node === '_QualifiedName');
  if (!firstQN) throw new Error('Indexer không có mục nào để tham chiếu bố cục.');
  const body0 = objBody(sf, o);
  const head = body0.subarray(0, firstQN.start - 4);
  const fixed = all.reduce((acc, it) =>
    acc + a4(4 + enc(it._QualifiedName).length) + 4 + a4(4 + enc(it._Name).length) + 12, 0);
  const budget = targetSize - head.length - 4 - fixed - 24;    // 4 = size mảng, 24 = 2 PPtr cuối
  if (budget < all.length * 4)
    throw new Error(`Không đủ chỗ cho ${all.length} mục (_Path cần tối thiểu ${all.length*4} B, còn ${budget} B).`);

  /* rút gọn _Path: bắt đầu từ tên file, nối dần thư mục cha cho đến sát ngân sách */
  const cur = all.map(it => it._Path.split('/').pop());
  const total = () => cur.reduce((a,p) => a + a4(4 + enc(p).length), 0);
  if (total() > budget) throw new Error('Không đủ chỗ cho _Path ngay cả khi chỉ giữ tên file.');
  for (let k = 0; k < all.length; k++){
    const parts = all[k]._Path.split('/');
    for (let d = 2; d <= parts.length; d++){
      const old = cur[k];
      cur[k] = parts.slice(-d).join('/');
      if (total() > budget){ cur[k] = old; break; }
    }
  }
  /* phần dư còn lại: nới thêm thư mục cha cho mục nào vừa khít, không chèn ký tự rác */
  let guard = 0;
  while (total() < budget && guard++ < 2000){
    let done = true;
    for (let k = 0; k < all.length; k++){
      const parts = all[k]._Path.split('/');
      const depth = cur[k].split('/').length;
      if (depth >= parts.length) continue;
      const old = cur[k];
      cur[k] = parts.slice(-(depth + 1)).join('/');
      if (total() > budget){ cur[k] = old; } else { done = false; break; }
    }
    if (done) break;
  }
  /* nếu vẫn thiếu vài byte, đệm bằng './' ở đầu một đường dẫn (vẫn là path hợp lệ) */
  guard = 0;
  while (total() < budget && guard++ < 500){
    let j = 0;
    for (let k = 1; k < cur.length; k++) if (cur[k].length < cur[j].length) j = k;
    cur[j] = './' + cur[j];
  }
  if (total() !== budget)
    throw new Error(`Không khớp ngân sách _Path (${total()} ≠ ${budget}).`);

  /* ghi lại object */
  const parts = [head];
  const cnt = new Uint8Array(4);
  new DataView(cnt.buffer).setInt32(0, all.length, true);
  parts.push(cnt);
  for (let k = 0; k < all.length; k++){
    const it = all[k];
    parts.push(wstr(it._QualifiedName));
    const ti = new Uint8Array(4);
    new DataView(ti.buffer).setInt32(0, it._TypeIndex, true);
    parts.push(ti);
    parts.push(wstr(it._Name));
    const pp = new Uint8Array(12);
    const pv = new DataView(pp.buffer);
    pv.setInt32(0, it.m_Item.m_FileID, true);
    pv.setBigInt64(4, it.m_Item.m_PathID, true);
    parts.push(pp);
    parts.push(wstr(cur[k]));
  }
  const tail = new Uint8Array(24);
  const tv = new DataView(tail.buffer);
  tv.setInt32(0, val.BaseMaleBone.m_FileID, true);
  tv.setBigInt64(4, val.BaseMaleBone.m_PathID, true);
  tv.setInt32(12, val.BaseFemaleBone.m_FileID, true);
  tv.setBigInt64(16, val.BaseFemaleBone.m_PathID, true);
  parts.push(tail);

  const len = parts.reduce((a,x) => a + x.length, 0);
  if (len !== targetSize) throw new Error(`Indexer dựng ra ${len} B, cần ${targetSize} B.`);
  const out = new Uint8Array(len);
  let w = 0;
  for (const x of parts){ out.set(x, w); w += x.length; }
  return { body: out, names: all.map(i => i._Name), paths: cur, addedCount: added.length };
}

/* Dựng lại CAB với các object đã thay */
function rebuildCab(sf, repl){
  const old = sf.cab.subarray(sf.dataOffset);
  const order = [...sf.objs].sort((a,b) => a.off - b.off);
  const chunks = [];
  const newOff = new Map();
  let prevEnd = 0, cursor = 0;
  for (const o of order){
    const gap = old.subarray(prevEnd, o.off);
    chunks.push(gap); cursor += gap.length;
    const body = repl.get(o.pid) ?? old.subarray(o.off, o.off + o.size);
    newOff.set(o.pid, cursor);
    chunks.push(body); cursor += body.length;
    prevEnd = o.off + o.size;
  }
  const tail = old.subarray(prevEnd);
  chunks.push(tail); cursor += tail.length;

  const data = new Uint8Array(cursor);
  let w = 0;
  for (const c of chunks){ data.set(c, w); w += c.length; }

  const meta = sf.cab.slice(0, sf.dataOffset);
  const mdv = new DataView(meta.buffer);
  for (const o of sf.objs){
    if (mdv.getBigInt64(o.ent, true) !== o.pid) throw new Error('Lệch bảng object.');
    const sz = repl.has(o.pid) ? repl.get(o.pid).length : o.size;
    if (sf.version >= 22){
      mdv.setBigInt64(o.ent + 8, BigInt(newOff.get(o.pid)), true);
      mdv.setUint32(o.ent + 16, sz, true);
    } else {
      mdv.setUint32(o.ent + 8, newOff.get(o.pid), true);
      mdv.setUint32(o.ent + 12, sz, true);
    }
  }
  const cabLen = sf.dataOffset + data.length;
  if (sf.version >= 22) mdv.setBigInt64(0x18, BigInt(cabLen), false);      // m_FileSize (big-endian)
  else mdv.setUint32(4, cabLen, false);

  const cab = new Uint8Array(cabLen);
  cab.set(meta, 0); cab.set(data, meta.length);
  return cab;
}

/* Dựng lại bundle, tái dùng luồng LZ4 blocksInfo của file gốc */
function rebuildBundle(orig, b, cab){
  /* Bản gốc đệm block thêm một số byte 0 sau node (ở đây là 4). Giữ đúng
     lượng đệm đó thì block — và do đó cả file — dài đúng như cũ. */
  const pad = b.blocks.reduce((a,x) => a + x.u, 0) - b.nodes[0].size;
  const block = new Uint8Array(cab.length + Math.max(0, pad));
  block.set(cab, 0);

  const info = b.info.slice();
  const idv = new DataView(info.buffer);
  idv.setUint32(20, block.length, false);           // block.u
  idv.setUint32(24, block.length, false);           // block.c
  idv.setBigInt64(42, BigInt(cab.length), false);   // node.size

  const ic = b.flags & 0x3F;
  let infoOut;
  if (ic === 0){
    infoOut = info;
  } else {
    /* blocksInfo mới chỉ khác bản gốc ở vài byte kích thước, và những byte đó
       nằm trong vùng literal của luồng LZ4 — vá thẳng vào luồng đã nén để giữ
       nguyên độ dài như bản gốc (tự nén lại sẽ dài hơn, làm lệch dung lượng). */
    const compOrig = orig.slice(b.infoOff, b.infoOff + b.ciSize);
    const root = lz4Trace(compOrig, b.uiSize);
    const patched = compOrig.slice();
    /* Một byte trong luồng nén có thể sinh ra nhiều byte đầu ra (qua match),
       nên gom yêu cầu lại và chỉ chấp nhận khi mọi byte liên quan cùng giá trị. */
    const want = new Map();
    for (let i = 0; i < info.length; i++){
      const src = root[i];
      if (src < 0){
        if (info[i] !== b.info[i])
          throw new Error(`blocksInfo: byte ${i} không truy được về literal.`);
        continue;
      }
      if (want.has(src) && want.get(src) !== info[i])
        throw new Error(`blocksInfo: byte ${i} xung đột với byte khác dùng chung nguồn.`);
      want.set(src, info[i]);
    }
    for (const [src, val] of want) patched[src] = val;
    const check = lz4dec(patched, b.uiSize);
    for (let i = 0; i < info.length; i++)
      if (check[i] !== info[i]) throw new Error('blocksInfo vá xong không khớp.');
    infoOut = patched;
  }

  const head = [];
  head.push(enc('UnityFS'), new Uint8Array([0]));
  const fb = new Uint8Array(4); new DataView(fb.buffer).setUint32(0, b.fmt, false);
  head.push(fb);
  head.push(enc(b.uv), new Uint8Array([0]), enc(b.rev), new Uint8Array([0]));
  const tailH = new Uint8Array(20);
  const tdv = new DataView(tailH.buffer);
  tdv.setUint32(8, infoOut.length, false);
  tdv.setUint32(12, b.uiSize, false);
  tdv.setUint32(16, b.flags, false);
  head.push(tailH);
  let hl = head.reduce((a,x) => a + x.length, 0);
  const padded = (b.fmt >= 7 || (b.flags & 0x200)) ? ((hl + 15) & ~15) : hl;
  const hdr = new Uint8Array(padded);
  let w = 0;
  for (const x of head){ hdr.set(x, w); w += x.length; }
  const sizePos = hdr.length - padded + (hl - 20);
  const total = padded + infoOut.length + block.length;
  new DataView(hdr.buffer).setBigInt64(sizePos, BigInt(total), false);

  const out = new Uint8Array(total);
  out.set(hdr, 0); out.set(infoOut, padded); out.set(block, padded + infoOut.length);
  return out;
}

function applyPreset2(orig, b, opt){
  if (b.blocks.some(x => (x.f & 0x3F) !== 0))
    throw new Error('Bundle có block bị nén — chưa hỗ trợ.');
  const node = b.nodes[0];
  const cab = orig.subarray(b.dataStart + node.off, b.dataStart + node.off + node.size);
  const sf = parseSF(cab);

  const male = sf.objs.find(o => o.pid === MALE_PID);
  const female = sf.objs.find(o => o.pid === FEMALE_PID);
  if (!male || !female) throw new Error('Không tìm thấy 2 UMAMeshAsset quen thuộc trong file này.');

  const rows = [];
  const repl = new Map();

  const pm = patchMesh(sf, male, opt.mx, null, opt.s);
  if (pm){
    repl.set(MALE_PID, pm.body);
    rows.push(['mesh nam', `umaBones[${pm.idx}]`, BACKPACK, 'bone_Head']);
    rows.push(['', 'position.x', pm.before.x.toFixed(6), pm.after.x.toFixed(6)]);
    rows.push(['', 'scale', `(${pm.before.sx.toFixed(4)}, ${pm.before.sy.toFixed(4)}, ${pm.before.sz.toFixed(4)})`,
                            `(${pm.after.sx.toFixed(4)}, ${pm.after.sy.toFixed(4)}, ${pm.after.sz.toFixed(4)})`]);
  }
  const pf = patchMesh(sf, female, opt.fx, opt.fz, opt.s);
  if (pf){
    repl.set(FEMALE_PID, pf.body);
    rows.push(['mesh nữ', `umaBones[${pf.idx}]`, BACKPACK, 'bone_Head']);
    rows.push(['', 'position.x', pf.before.x.toFixed(6), pf.after.x.toFixed(6)]);
    rows.push(['', 'position.z', pf.before.z.toFixed(6), pf.after.z.toFixed(6)]);
    rows.push(['', 'scale', `(${pf.before.sx.toFixed(4)}, ${pf.before.sy.toFixed(4)}, ${pf.before.sz.toFixed(4)})`,
                            `(${pf.after.sx.toFixed(4)}, ${pf.after.sy.toFixed(4)}, ${pf.after.sz.toFixed(4)})`]);
  }
  if (!repl.size) throw new Error(`Không tìm thấy xương ${BACKPACK} trong mesh nào — file có thể đã được sửa rồi.`);

  /* Tìm UMAAssetIndexer */
  const idxObj = sf.objs.find(o => {
    const t = sf.types[o.tid];
    if (t.cid !== 114 || !t.nodes) return false;
    return buildNodes(t).some(n => n.level === 1 && n.name === 'Items');
  });
  if (!idxObj) throw new Error('Không tìm thấy UMAAssetIndexer.');

  /* Mọi RaceData / UMATextRecipe trong bundle — để bổ sung mục còn thiếu */
  const known = [];
  for (const o of sf.objs){
    const t = sf.types[o.tid];
    if (t.cid !== 114 || !t.nodes || o.pid === idxObj.pid) continue;
    const nn = buildNodes(t).filter(n => n.level === 1).map(n => n.name);
    const isRace   = nn.includes('raceName');
    const isRecipe = nn.includes('recipeData');
    if (!isRace && !isRecipe) continue;
    const v = readObj(sf, o, null);
    known.push({ pid: o.pid, name: v.m_Name, typeIndex: isRace ? 2 : 3 });
  }

  /* Kích thước đích của indexer: bù lại đúng phần mà 2 mesh đã co lại,
     để tổng CAB — và do đó dung lượng file — không đổi. */
  let delta = 0;
  for (const [pid, body] of repl) delta += body.length - sf.objs.find(o => o.pid === pid).size;
  const targetSize = idxObj.size - delta;

  const si = rebuildIndexer(sf, idxObj, known, targetSize);
  repl.set(idxObj.pid, si.body);
  rows.push(['indexer', `${si.names.length} mục`,
             `${si.names.length - si.addedCount} mục ban đầu`,
             `thêm ${si.addedCount} mục · _Path rút gọn`]);

  const newCab = rebuildCab(sf, repl);
  const out = rebuildBundle(orig, b, newCab);
  return {
    out,
    note: `Đã dựng lại bundle — ${repl.size} object thay đổi, dung lượng giữ nguyên ${out.length.toLocaleString('vi-VN')} byte.`,
    cols: ['Vùng','Trường','Trước','Sau'], rows,
    extra: si
  };
}

/* Giải nén một shader đã nhúng (deflate + base64) */
async function loadXray(key){
  const e = XRAY_BLOB[key];
  if (!e) throw new Error(`Không có shader nhúng tên "${key}".`);
  const raw = Uint8Array.from(atob(e.z), c => c.charCodeAt(0));
  const ds = new DecompressionStream('deflate');
  const buf = new Uint8Array(await new Response(
    new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());
  if (buf.length !== e.size)
    throw new Error(`Shader nhúng "${key}" giải ra ${buf.length} byte, cần ${e.size}.`);
  return { body: buf, pid: BigInt(e.pid) };
}

/* Đọc danh sách property của một Shader (class 48) và offset byte của m_DefValue.
   SerializedProperty: m_Name, m_Description, m_Attributes[], m_Type(i32),
   m_Flags(u32), m_DefValue[0..3](f32), m_DefTexture{m_DefaultName, m_TexDim} */
function readShaderProps(body){
  const dv = new DataView(body.buffer, body.byteOffset, body.byteLength);
  let p = 0;
  const rd = () => { const v = dv.getInt32(p, true); p += 4; return v; };
  const str = () => {
    const n = rd();
    if (n < 0 || p + n > body.length) throw new Error('chuỗi hỏng trong shader');
    const s = new TextDecoder().decode(body.subarray(p, p + n));
    p = a4(p + n);
    return s;
  };
  str();                                   // Shader.m_Name
  const cnt = rd();
  if (cnt < 0 || cnt > 500) throw new Error(`số property bất thường: ${cnt}`);
  const props = [];
  for (let i = 0; i < cnt; i++){
    const name = str(), desc = str();
    const na = rd();
    if (na < 0 || na > 100) throw new Error('m_Attributes hỏng');
    for (let k = 0; k < na; k++) str();
    const type = rd();
    p += 4;                                // m_Flags
    const valOff = p;
    const val = [dv.getFloat32(p,true), dv.getFloat32(p+4,true),
                 dv.getFloat32(p+8,true), dv.getFloat32(p+12,true)];
    p += 16;
    str();                                 // m_DefTexture.m_DefaultName
    p += 4;                                // m_TexDim
    props.push({ name, desc, type, valOff, val });
  }
  return props;
}

const hex2rgb = h => {
  const m = /^#?([0-9a-f]{6})$/i.exec(h.trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255];
};
const rgb2hex = v =>
  '#' + v.slice(0,3).map(x => Math.round(Math.max(0,Math.min(1,x))*255)
        .toString(16).padStart(2,'0')).join('').toUpperCase();

   _OutLineColor / _DimColor (uibgglass, toonoutline…) nhưng không liên quan
   wallhack — đổi chúng sẽ hỏng giao diện và viền toon. */
const XRAY_SHADERS = ['backweapon', 'brmobilebumpspec', 'brmobilebumpspecdecal'];
const isXrayShader = path => {
  const f = path.split('/').pop().replace(/\.shader$/, '');
  return XRAY_SHADERS.includes(f);
};

/* Ghi màu vào một shader body (sửa tại chỗ, không đổi độ dài) */
function paintShader(body, opt, short, rows){
  const props = readShaderProps(body);
  const dv = new DataView(body.buffer, body.byteOffset, body.byteLength);
  let n = 0;
  for (const p of props){
    const spec = COLOR_MAP[p.name];
    if (!spec) continue;
    let next;
    if (spec.kind === 'color'){
      const rgb = opt[spec.src];
      const alpha = (p.name === '_XRayColor') ? opt.alpha : p.val[3];
      next = [rgb[0], rgb[1], rgb[2], alpha];
    } else {
      next = [opt.width, p.val[1], p.val[2], p.val[3]];
    }
    const before = spec.kind === 'color' ? rgb2hex(p.val) : p.val[0].toFixed(2);
    const after  = spec.kind === 'color' ? rgb2hex(next)  : next[0].toFixed(2);
    for (let i = 0; i < 4; i++) dv.setFloat32(p.valOff + i*4, next[i], true);
    n++;
    if (rows){
      const sw  = spec.kind === 'color' ? `<span class="swatch" style="background:${before}"></span>` : '';
      const sw2 = spec.kind === 'color' ? `<span class="swatch" style="background:${after}"></span>` : '';
      rows.push([short, p.name, sw + before, sw2 + after]);
    }
  }
  return n;
}

async function applyPreset3(orig, b, opt){
  const node = b.nodes[0];
  if (!node) throw new Error('Bundle không có node nào.');

  const { data, blockAt } = decompressAll(orig, b);
  const cab = data.subarray(node.off, node.off + node.size);
  const sf = parseSF(cab);
  const adr = parseHexCode(ADR_XRAY_HEX);           // shader X-Ray 2 lớp ADR
  const nameOf = containerNames(sf);

  /* Shader súng, nhận theo tên: backweapon + brmobilebumpspec */
  const slots = new Map();
  for (const o of sf.objs){
    if (o.cid !== 48) continue;
    const path = nameOf.get(o.pid);
    if (!path || !isXrayShader(path)) continue;
    const key = path.split('/').pop().replace(/\.shader$/, '');
    slots.set(key, o);
  }
  if (!slots.size)
    throw new Error('Không tìm thấy backweapon / brmobilebumpspec / brmobilebumpspecdecal trong bundle này. ' +
                    'Đây có phải file shaders của game không?');

  const fmt = n => n.toLocaleString('vi-VN');
  const rows = [], repl = new Map();
  let painted = 0, keoDone = false;
  for (const [key, o] of slots){
    const isKeo = key === 'brmobilebumpspecdecal';
    if (isKeo && !opt.keo) continue;                  // người dùng tắt keo
    if (adr.length > o.size){
      if (isKeo){ rows.push([key + '.shader', '(không đổi)', `${fmt(o.size)} B`, 'quá nhỏ cho ADR — bỏ qua keo']); continue; }
      throw new Error(`Shader ${key} trong file chỉ ${fmt(o.size)} B, nhỏ hơn shader ADR ` +
                      `(${fmt(adr.length)} B) — không đệm vừa.`);
    }
    const body = new Uint8Array(o.size);              // giữ nguyên kích thước, đệm 0
    body.set(adr, 0);
    rows.push([key + '.shader', '(toàn bộ shader)', `gốc ${fmt(o.size)} B`,
               `ADR 2 lớp ${fmt(adr.length)} B + đệm`]);
    /* Keo: chỉ lớp 1 (màu keo), lớp viền cùng màu và dày 0 */
    const popt = isKeo
      ? { xray: opt.dim, line: opt.dim, dim: opt.dim, width: 0, alpha: opt.dimA }
      : { ...opt, dim: [0, 0, 0] };
    painted += paintShader(body, popt, key + '.shader', rows);
    repl.set(o.pid, body);
    if (isKeo) keoDone = true;
  }
  if (!repl.size) throw new Error('Không có shader súng nào để thay.');
  if (!painted) throw new Error('Không ghi được giá trị màu nào vào shader.');

  const fit = rebuildFit(orig, b, data, blockAt, sf, node,
                          [...repl].map(([pid, body]) => ({ pid, body })), opt.limit);
  const dropped = repl.size - fit.used;
  return {
    out: fit.out,
    note: `Đã thay <b>${fit.used}</b> shader (súng${keoDone ? ' + keo' : ''}) bằng bản X-Ray 2 lớp ADR và đặt màu — ` +
          `${painted} giá trị, dung lượng giữ nguyên ${fmt(fit.out.length)} byte.` +
          (dropped ? ` <b>Lưu ý:</b> file gốc không đủ chỗ nên chỉ đổi ${fit.used}/${repl.size} shader.` : ''),
    cols: ['Shader','Property','Trước','Sau'], rows, html: true
  };
}

/* Dựng bundle; nếu file gốc không đủ chỗ cho mọi shader thì tự bỏ bớt các shader
   ưu tiên thấp nhất (cuối danh sách) cho tới khi vừa — dung lượng luôn bằng file gốc. */
function rebuildFit(orig, b, data0, blockAt, sf, node, entries, limit){
  const run = (n, mode) => rebuildShaders(orig, b, data0.slice(), blockAt, sf, node,
                   new Map(entries.slice(0, n).map(e => [e.pid, e.body])), limit, mode);
  let first;
  /* 1) nén nhanh cho tất cả */
  try { return { out: run(entries.length, 'fast'), used: entries.length }; }
  catch (e) { if (!e.overflow) throw e; first = e; }
  /* 2) chênh lệch nhỏ (nén sâu bù được ~1%) → nén sâu từng block cho tới khi vừa */
  if (first.overflow <= 0.012 * first.comp){
    try { return { out: run(entries.length, 'auto'), used: entries.length }; }
    catch (e) { if (!e.overflow) throw e; first = e; }
  }
  /* 3) không vừa → dò số shader nhiều nhất còn vừa chỗ (nén nhanh cho mỗi lần thử) */
  let lo = 1, hi = entries.length - 1, best = null;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    try { best = { out: run(mid, 'fast'), used: mid }; lo = mid + 1; }
    catch (e) { if (!e.overflow) throw e; hi = mid - 1; }
  }
  if (!best) throw first;
  return best;
}

/* Tên asset của từng object trong bundle (từ AssetBundle.m_Container) */
function containerNames(sf){
  const abObj = sf.objs.find(o => o.cid === 142);
  const nameOf = new Map();
  if (abObj){
    const v = readObj(sf, abObj, null);
    for (const c of v.m_Container) nameOf.set(c.second.asset.m_PathID, c.first);
  }
  return nameOf;
}
const tail2 = path => path.split('/').slice(-2).join('/').replace(/\.shader$/i, '').toLowerCase();

/* Giải nén mọi block, ghi lại block nào phủ vùng nào */
function decompressAll(orig, b){
  const parts = [];
  const blockAt = [];
  let pos = b.dataStart, outPos = 0;
  for (const blk of b.blocks){
    const raw = orig.subarray(pos, pos + blk.c);
    const ct = blk.f & 0x3F;
    if (ct !== 0 && ct !== 2 && ct !== 3)
      throw new Error(`Block nén kiểu ${ct} (LZMA/khác) — tool chỉ hỗ trợ LZ4 hoặc lưu thô. Game có thể đã đổi định dạng bundle.`);
    const dec = (ct === 2 || ct === 3) ? lz4dec(raw, blk.u) : raw.slice();
    parts.push(dec);
    blockAt.push({ start: outPos, end: outPos + blk.u, comp: blk.c, ct, srcOff: pos });
    outPos += blk.u; pos += blk.c;
  }
  const data = new Uint8Array(outPos);
  let w = 0;
  for (const p of parts){ data.set(p, w); w += p.length; }
  return { data, blockAt };
}

/*
  Dựng lại bundle shaders sau khi thay/sơn shader.

  Thay shader làm object đổi độ dài → phải dựng lại CAB (bảng object + vùng dữ
  liệu), rồi nén lại toàn bộ block. Bộ nén ở đây kém LZ4HC gốc vài phần trăm;
  phần phình ra được bù bằng vùng đệm cuối file để dung lượng không đổi.
*/
function rebuildShaders(orig, b, data, blockAt, sf, node, repl, limit, mode){
  /* Mọi object giữ nguyên kích thước (shader X-Ray đã được đệm 0 cho bằng
     shader gốc), nên chỉ cần ghi đè tại chỗ vào luồng dữ liệu đã giải nén và
     nén lại đúng những block bị đụng. */
  const touched = new Set();
  for (const o of sf.objs){
    const body = repl.get(o.pid);
    if (!body) continue;
    if (body.length !== o.size)
      throw new Error(`Object ${o.pid} đổi kích thước (${o.size} → ${body.length}) — chưa hỗ trợ.`);
    const abs = node.off + sf.dataOffset + o.off;
    data.set(body, abs);
    for (let i = 0; i < blockAt.length; i++){
      const s = blockAt[i];
      if (abs < s.end && abs + body.length > s.start) touched.add(i);
    }
  }
  if (!touched.size) throw new Error('Không có gì thay đổi.');

  /* Nén lại block bị đụng, giữ nguyên byte gốc cho các block còn lại.
     Nén nhanh trước; nếu tổng vượt dung lượng gốc thì nâng từng block lên mức
     nén sâu nhất (khớp LZ4HC gốc) cho tới khi vừa. */
  const atEnd = !!(b.flags & 0x80);
  const headLen = atEnd ? b.dataStart : b.infoOff;
  const encMap = new Map();                        // block → {comp, flags, hi}
  const encode = (i, hi) => {
    const blk = b.blocks[i], at = blockAt[i];
    const raw = data.subarray(at.start, at.end);
    let comp, flags = blk.f;
    if ((blk.f & 0x3F) === 0){ comp = raw; }
    else {
      comp = lz4enc(raw, hi);
      const back = lz4dec(comp, raw.length);
      for (let k = 0; k < raw.length; k++)
        if (back[k] !== raw[k]) throw new Error(`Nén lại block ${i} sai ở byte ${k}.`);
      if (comp.length >= raw.length){ comp = raw; flags = blk.f & ~0x3F; }
    }
    encMap.set(i, { comp, flags, hi });
  };
  for (const i of touched) encode(i, false);

  const assemble = () => {
    const parts = [], newBlocks = [];
    for (let i = 0; i < b.blocks.length; i++){
      const blk = b.blocks[i], at = blockAt[i];
      if (!touched.has(i)){
        parts.push(orig.subarray(at.srcOff, at.srcOff + blk.c));
        newBlocks.push({ u: blk.u, c: blk.c, f: blk.f });
      } else {
        const e = encMap.get(i);
        parts.push(e.comp);
        newBlocks.push({ u: blk.u, c: e.comp.length, f: e.flags });
      }
    }
    /* blocksInfo: giữ nguyên bố cục gốc, chỉ cập nhật kích thước block */
    const info = b.info.slice();
    const idv = new DataView(info.buffer, info.byteOffset, info.byteLength);
    let q = 20;
    for (const nb of newBlocks){
      idv.setUint32(q, nb.u, false);
      idv.setUint32(q + 4, nb.c, false);
      idv.setUint16(q + 8, nb.f, false);
      q += 10;
    }
    const infoOut = ((b.flags & 0x3F) === 0) ? info : lz4enc(info, true);
    const dataLen = parts.reduce((a, x) => a + x.length, 0);
    let core = headLen + dataLen + infoOut.length;
    if (!atEnd && (b.flags & 0x200))
      core = ((headLen + infoOut.length + 15) & ~15) + dataLen;
    return { parts, info, infoOut, core };
  };

  let asm = assemble();
  const cap = limit ?? orig.length;
  if (asm.core > cap && mode !== 'fast'){
    const order = [...touched].filter(i => (b.blocks[i].f & 0x3F) !== 0)
      .sort((x, y) => (encMap.get(y).comp.length - b.blocks[y].c) - (encMap.get(x).comp.length - b.blocks[x].c));
    for (const i of order){
      encode(i, true);
      asm = assemble();
      if (asm.core <= cap) break;
    }
  }
  const { parts, info, infoOut, core } = asm;
  if (core > cap){
    const er = new Error(`Nén lại phình ${(core - cap).toLocaleString('vi-VN')} byte so với ` +
                         `dung lượng gốc — không đủ chỗ đệm.`);
    er.overflow = core - cap;
    er.comp = [...touched].reduce((a, i) => a + encMap.get(i).comp.length, 0);
    throw er;
  }

  const out = new Uint8Array(orig.length);           // phần dư tự là 0
  if (atEnd){
    out.set(orig.subarray(0, headLen), 0);
    let p = headLen;
    for (const x of parts){ out.set(x, p); p += x.length; }
    out.set(infoOut, p);
  } else {
    out.set(orig.subarray(0, b.infoOff), 0);
    out.set(infoOut, b.infoOff);
    let p = b.infoOff + infoOut.length;
    if (b.flags & 0x200) p = (p + 15) & ~15;
    for (const x of parts){ out.set(x, p); p += x.length; }
  }
  const sp = findSizePos(out);
  const odv = new DataView(out.buffer);
  /* Với blocksInfoAtTheEnd, blocksInfo nằm ngay sau vùng dữ liệu chứ không ở
     cuối file — phần đệm nằm sau nó. Trường size phải khai đúng phần thực
     dùng, nếu không hàm dò blocksInfo sẽ tìm sai chỗ. */
  odv.setBigInt64(sp, BigInt(atEnd ? core : out.length), false);
  odv.setUint32(sp + 8, infoOut.length, false);      // ciSize
  odv.setUint32(sp + 12, info.length, false);        // uiSize

  /* Tự kiểm tra: mở lại chính file vừa dựng, giải nén toàn bộ và so từng byte
     với dữ liệu đã sửa; dung lượng phải bằng đúng file gốc. */
  if (out.length !== orig.length) throw new Error('Dung lượng đầu ra khác file gốc.');
  const b2 = parseBundle(out);
  const chk = decompressAll(out, b2).data;
  if (chk.length !== data.length) throw new Error('Tự kiểm tra thất bại: độ dài dữ liệu lệch.');
  for (let k = 0; k < data.length; k++)
    if (chk[k] !== data[k]) throw new Error(`Tự kiểm tra thất bại: lệch byte ${k}.`);
  return out;
}

/* Vị trí trường size (int64 BE) trong header UnityFS */
function findSizePos(u8){
  let p = 0;
  while (u8[p]) p++;               // "UnityFS"
  p++; p += 4;                     // \0 + version
  while (u8[p]) p++; p++;          // unityVersion
  while (u8[p]) p++; p++;          // unityRevision
  return p;
}

let FILE = null, ORIG = null, BUN = null;
const el = id => document.getElementById(id);
const show = (id, html) => { el(id).innerHTML = html; };
function hexValue(id) { return hex2rgb(el(id).value) || [0,0,0]; }
function parseHexCode(text) {
  const clean = String(text || '').replace(/0x/gi, '').replace(/[^0-9a-f]/gi, '');
  if (!clean || clean.length % 2) throw new Error('Cấu hình HEX không hợp lệ.');
  const out = new Uint8Array(clean.length / 2);
  for (let i=0;i<out.length;i++) out[i] = parseInt(clean.slice(i*2,i*2+2),16);
  return out;
}
function gunOptions() { return {xray:hexValue('cXray'),line:hexValue('cLine'),dim:[0,0,0],width:Number(el('rWidth').value),alpha:Number(el('rAlpha').value),dimA:0,keo:false}; }
el('file').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  FILE=f; ORIG=null; BUN=null; el('go').disabled=true;
  show('info','<div class="msg warn">Đang kiểm tra file…</div>'); show('out','');
  try{
    ORIG=new Uint8Array(await f.arrayBuffer());
    BUN=parseBundle(ORIG);
    el('fileName').textContent=`${f.name} — ${ORIG.length.toLocaleString('vi-VN')} byte`;
    show('info',inspectBundle(ORIG,BUN).html);
    el('go').disabled=false;
  }catch(err){
    console.error(err);
    el('fileName').textContent=f.name;
    show('info','<div class="msg bad">Không thể xử lý file: '+esc(err.message||err)+'</div>');
  }
});
el('rWidth').addEventListener('input',()=>el('wVal').textContent=Number(el('rWidth').value).toFixed(1));
el('rAlpha').addEventListener('input',()=>el('aVal').textContent=Number(el('rAlpha').value).toFixed(2));
/* Đọc file và cho biết tool có xử lý được không — để thấy ngay khi file tháng mới đổi cấu trúc */
function inspectBundle(orig,b){
  const node=b.nodes[0]; if(!node) throw new Error('Bundle không có node dữ liệu.');
  const {data}=decompressAll(orig,b);
  const cab=data.subarray(node.off,node.off+node.size), sf=parseSF(cab);
  const fmt=n=>n.toLocaleString('vi-VN');
  const plat=sf.target===13?'Android':sf.target===9?'iOS':`target ${sf.target}`;
  const shaders=sf.objs.filter(o=>o.cid===48);
  const nameOf=containerNames(sf), adrLen=ADR_XRAY_HEX.length/2;
  const gun=[]; for(const o of shaders){ const p=nameOf.get(o.pid); if(p&&isXrayShader(p)&&!/decal/i.test(p)) gun.push({n:p.split('/').pop().replace(/\.shader$/,''),size:o.size}); }
  const warn=[];
  if(!gun.some(g=>g.n!=='brmobilebumpspecdecal')) warn.push('không thấy shader súng (backweapon / brmobilebumpspec)');
  gun.filter(g=>g.n!=='brmobilebumpspecdecal'&&g.size<adrLen).forEach(g=>warn.push(`${g.n} (${fmt(g.size)} B) nhỏ hơn shader ADR (${fmt(adrLen)} B)`));
  let html=`<div class="msg ok">File sẵn sàng — <b>${plat}</b>, ${fmt(shaders.length)} shader, ${fmt(orig.length)} byte.<br>`+
    `Súng: ${gun.map(g=>`${g.n} ${fmt(g.size)} B`).join(' · ')||'—'}</div>`;
  if(warn.length) html+=`<div class="msg warn">Lưu ý: ${warn.map(esc).join('; ')}. Tool có thể không áp dụng được cho file này.</div>`;
  return {html,plat:sf.target};
}
function resultHtml(note,cols,rows){
  let t='';
  if(rows&&rows.length) t='<div class="hexwrap"><table class="hex"><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>'+
    rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</table></div>';
  return `<section class="panel"><div class="msg ok res-note">${note}</div>${t}<button id="dl" style="margin-top:14px">Tải file</button></section>`;
}
el('go').addEventListener('click',async()=>{
  const btn=el('go'); btn.disabled=true; btn.textContent='Đang xử lý…';
  try{
    if(!ORIG||!BUN) throw new Error('Chưa chọn file.');
    const r=await applyPreset3(ORIG,BUN,gunOptions());
    const output=r.out, cols=r.cols, rows=r.rows; let note=r.note;
    /* Đối chiếu dung lượng với file gốc */
    if(output.length!==ORIG.length) throw new Error(`Dung lượng lệch: gốc ${ORIG.length} ≠ mới ${output.length}.`);
    note+=` <br>Dung lượng: gốc <b>${ORIG.length.toLocaleString('vi-VN')}</b> = mới <b>${output.length.toLocaleString('vi-VN')}</b> byte ✓`;
    show('out',resultHtml(note,cols,rows));
    el('dl').onclick=()=>{
      const u=URL.createObjectURL(new Blob([output],{type:'application/octet-stream'})),a=document.createElement('a');
      a.href=u;a.download=FILE.name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),1000);
    };
  }catch(err){
    console.error('Processing failed:',err);
    show('out','<div class="msg bad">Không thể hoàn tất: '+esc(err.message||err)+'</div>');
  }finally{
    btn.disabled=false; btn.textContent='Tạo file';
  }
});

/* ═══════════ Màu làm sẵn + ô nhập mã màu ═══════════ */
const GUN_PRESETS=[
  {n:'ADR gốc',      x:'#FFFFFF', l:'#0000FF', d:'#111111', w:5},
  {n:'Đen · Trắng',  x:'#111111', l:'#FFFFFF', d:'#111111', w:4},
  {n:'Đỏ · Trắng',   x:'#FF0000', l:'#FFFFFF', d:'#330000', w:4},
  {n:'Xanh · Cyan',  x:'#0066FF', l:'#00FFFF', d:'#001133', w:4},
  {n:'Lục · Vàng',   x:'#00FF55', l:'#FFFF00', d:'#003311', w:4},
  {n:'Tím · Hồng',   x:'#8000FF', l:'#FF4DDB', d:'#1A0033', w:4},
  {n:'Cam · Vàng',   x:'#FF7A00', l:'#FFE600', d:'#331700', w:4},
  {n:'Hồng · Trắng', x:'#FF2D95', l:'#FFFFFF', d:'#33001A', w:4},
  {n:'Vàng · Đen',   x:'#FFD400', l:'#000000', d:'#332A00', w:4}
];
const normHex=v=>{const m=/^#?([0-9a-f]{6})$/i.exec(String(v).trim());return m?'#'+m[1].toUpperCase():null;};
function setColor(id,v){ const c=el(id); c.value=v.toLowerCase(); c.dispatchEvent(new Event('input',{bubbles:true})); }
function setRange(id,v){ const r=el(id); r.value=v; r.dispatchEvent(new Event('input',{bubbles:true})); }
function bindPair(cid,tid){
  const c=el(cid),t=el(tid);
  c.addEventListener('input',()=>{t.value=c.value.toUpperCase();t.classList.remove('bad');});
  t.addEventListener('input',()=>{
    const h=normHex(t.value);
    if(!h){t.classList.add('bad');return;}
    t.classList.remove('bad'); c.value=h.toLowerCase();
    c.dispatchEvent(new Event('input',{bubbles:true}));
  });
  t.addEventListener('blur',()=>{t.value=c.value.toUpperCase();t.classList.remove('bad');});
}
function renderPresets(boxId,list,dots,apply){
  const box=el(boxId); box.innerHTML='';
  list.forEach(p=>{
    const b=document.createElement('button'); b.type='button'; b.className='pchip';
    b.innerHTML='<i>'+dots(p).map(c=>`<b style="background:${c}"></b>`).join('')+'</i>'+esc(p.n);
    b.addEventListener('click',()=>{ box.querySelectorAll('.pchip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); apply(p); });
    box.appendChild(b);
  });
  return box;
}
bindPair('cXray','tXray'); bindPair('cLine','tLine');
renderPresets('gunPresets',GUN_PRESETS,p=>[p.x,p.l],p=>{
  setColor('cXray',p.x); setColor('cLine',p.l); setRange('rWidth',p.w); setRange('rAlpha',1);
}).firstChild.classList.add('sel');
/* Chỉnh tay thì bỏ đánh dấu preset */
for(const [ids,box] of [[['cXray','cLine','rWidth','rAlpha'],'gunPresets']])
  ids.forEach(i=>el(i).addEventListener('input',e=>{ if(e.isTrusted) el(box).querySelectorAll('.pchip').forEach(x=>x.classList.remove('sel')); }));
</script>
