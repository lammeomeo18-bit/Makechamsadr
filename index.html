</style>

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function lz4dec(src, outSize){
  const dst = new Uint8Array(outSize);
  const n = src.length;
  let i = 0, o = 0;
  while (i < n){
    const tok = src[i++];

    let lit = tok >> 4;
    if (lit === 15){
      let b;
      do { if (i >= n) throw new Error('LZ4: hết dữ liệu ở độ dài literal'); b = src[i++]; lit += b; }
      while (b === 255);
    }
    if (lit){
      if (i + lit > n) throw new Error('LZ4: literal vượt biên');
      if (o + lit > outSize) throw new Error('LZ4: literal vượt kích thước đầu ra');
      dst.set(src.subarray(i, i + lit), o);
      i += lit; o += lit;
    }

    /* token cuối chỉ có literal, không kèm match */
    if (i >= n) break;

    const off = src[i] | (src[i+1] << 8); i += 2;
    if (off === 0 || off > o) throw new Error(`LZ4: offset không hợp lệ (${off})`);
    let ml = tok & 15;
    if (ml === 15){
      let b;
      do { if (i >= n) throw new Error('LZ4: hết dữ liệu ở độ dài match'); b = src[i++]; ml += b; }
      while (b === 255);
    }
    ml += 4;
    if (o + ml > outSize) throw new Error('LZ4: match vượt kích thước đầu ra');
    /* copy từng byte — vùng match có thể chồng lấn khi off < ml */
    let sp = o - off;
    for (let k = 0; k < ml; k++) dst[o++] = dst[sp++];
  }
  if (o !== outSize) throw new Error(`LZ4: giải ra ${o} byte, cần ${outSize}`);
  return dst;
}

function lz4enc(src, hi){
  const n = src.length;
  if (!n) return new Uint8Array(0);
  const MFLIMIT = 12, LASTLIT = 5, MAXDIST = 65535, HLOG = 16;
  /* hi = true: tìm sâu tối đa, cho ra đúng dung lượng của LZ4HC gốc (chậm hơn) */
  const DEPTH = hi ? 65536 : 1024, SUFF = hi ? 1e9 : 64, TRY = hi ? 4096 : 128;
  const out = [];
  const pushLen = r => { while (r >= 255){ out.push(255); r -= 255; } out.push(r); };
  const emit = (ls, le, mlen, moff) => {
    const litlen = le - ls, ml = mlen ? mlen - 4 : 0;
    out.push(((litlen >= 15 ? 15 : litlen) << 4) | (ml >= 15 ? 15 : ml));
    if (litlen >= 15) pushLen(litlen - 15);
    for (let k = ls; k < le; k++) out.push(src[k]);
    if (mlen){ out.push(moff & 255, (moff >> 8) & 255); if (ml >= 15) pushLen(ml - 15); }
  };
  const limitPos = n - MFLIMIT;           // vị trí cuối cùng được phép bắt đầu match: < limitPos
  if (limitPos <= 0){ emit(0, n, 0, 0); return new Uint8Array(out); }

  const head = new Int32Array(1 << HLOG).fill(-1);
  const prev = new Int32Array(n).fill(-1);
  const h4 = i => (Math.imul((src[i] | (src[i+1]<<8) | (src[i+2]<<16) | (src[i+3]<<24)) >>> 0, 2654435761) >>> (32 - HLOG));
  const mLen = new Int32Array(n), mOff = new Int32Array(n);
  let inserted = 0;
  for (let i = 0; i < limitPos; i++){
    while (inserted < i){ const hk = h4(inserted); prev[inserted] = head[hk]; head[hk] = inserted; inserted++; }
    const maxL = n - LASTLIT - i;
    let bl = 0, bo = 0;
    /* kéo dài match của vị trí trước (rất nhanh với đoạn lặp dài) */
    if (i > 0 && mLen[i-1] > SUFF){ bl = mLen[i-1] - 1; bo = mOff[i-1]; }
    else {
      let cur = head[h4(i)], cnt = 0;
      while (cur >= 0 && cnt < DEPTH){
        const off = i - cur;
        if (off > MAXDIST) break;
        if (src[cur+bl] === src[i+bl] && src[cur] === src[i] && src[cur+1] === src[i+1] && src[cur+2] === src[i+2] && src[cur+3] === src[i+3]){
          let l = 4;
          while (l < maxL && src[cur+l] === src[i+l]) l++;
          if (l > bl){ bl = l; bo = off; if (l >= maxL || l >= 4096) break; }
        }
        cur = prev[cur]; cnt++;
      }
    }
    if (bl > maxL) bl = maxL;
    if (bl >= 4){ mLen[i] = bl; mOff[i] = bo; }
  }

  const INF = 0x3fffffff;
  const price = new Int32Array(n + 1).fill(INF), lit = new Int32Array(n + 1);
  const pPos = new Int32Array(n + 1).fill(-1), pLen = new Int32Array(n + 1);
  price[0] = 0;
  const mcost = l => { const m = l - 4; return 3 + (m >= 15 ? 1 + Math.floor((m - 15) / 255) : 0); };
  for (let i = 0; i < n; i++){
    const pi = price[i];
    if (pi >= INF) continue;
    /* thêm 1 literal */
    const nl = lit[i] + 1;
    const lc = pi + 1 + ((nl >= 15 && (nl - 15) % 255 === 0) ? 1 : 0);
    if (lc < price[i+1]){
      price[i+1] = lc; lit[i+1] = nl; pPos[i+1] = i; pLen[i+1] = 0;
    }
    const L = mLen[i];
    if (L >= 4){
      const top = Math.min(L, TRY);
      for (let l = 4; l <= top; l++){
        const c = pi + mcost(l), j = i + l;
        if (c < price[j]){ price[j] = c; lit[j] = 0; pPos[j] = i; pLen[j] = l; }
      }
      if (L > TRY){
        const c = pi + mcost(L), j = i + L;
        if (c < price[j]){ price[j] = c; lit[j] = 0; pPos[j] = i; pLen[j] = L; }
      }
    }
  }
  /* truy ngược */
  const seq = [];
  let pos = n;
  while (pos > 0){
    if (pLen[pos] > 0){ const st = pPos[pos]; seq.push([st, pLen[pos], mOff[st]]); pos = st; }
    else pos--;
  }
  seq.reverse();
  let anchor = 0;
  for (const [st, l, off] of seq){ emit(anchor, st, l, off); anchor = st + l; }
  emit(anchor, n, 0, 0);
  return new Uint8Array(out);
}

function parseBundle(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let p = 0;
  const cstr = () => { let s = ''; while (u8[p]) s += String.fromCharCode(u8[p++]); p++; return s; };

  const sig = cstr();
  if (sig !== 'UnityFS') throw new Error(`Không phải UnityFS bundle (signature "${sig}")`);
  const fmt = dv.getUint32(p, false); p += 4;
  const uv = cstr(), rev = cstr();
  const declared = Number(dv.getBigInt64(p, false)); p += 8;
  const ciSize = dv.getUint32(p, false); p += 4;
  const uiSize = dv.getUint32(p, false); p += 4;
  const flags  = dv.getUint32(p, false); p += 4;
  const headerEnd = p;
  const ic = flags & 0x3F;

  let infoOff, info, dataStart;
  if (flags & 0x80){
    /* blocksInfoAtTheEnd: blocksInfo nằm cuối phần dữ liệu thực dùng.
       Trường size có thể sai (file còn đuôi thừa) nên dò ngược để tìm.
       Vùng dữ liệu vẫn căn lề 16 sau header, kể cả khi cờ 0x200 không bật. */
    dataStart = (headerEnd + 15) & ~15;
    infoOff = null;
    const from = Math.min(declared, u8.length) - ciSize;
    for (let off = from; off >= Math.max(0, from - 80000); off--){
      try {
        const cand = (ic === 2 || ic === 3)
          ? lz4dec(u8.subarray(off, off + ciSize), uiSize)
          : u8.subarray(off, off + ciSize).slice();
        info = cand; infoOff = off; break;
      } catch (e) { /* thử vị trí trước đó */ }
    }
    if (infoOff === null) throw new Error('Không tìm được blocksInfo ở cuối file.');
  } else {
    if (fmt >= 7 || (flags & 0x200)) p = (p + 15) & ~15;
    infoOff = p;
    const infoRaw = u8.subarray(p, p + ciSize);
    if (ic === 2 || ic === 3) info = lz4dec(infoRaw, uiSize);
    else if (ic === 0) info = infoRaw.slice();
    else throw new Error(`blocksInfo nén kiểu ${ic} (chưa hỗ trợ)`);
    /* sau blocksInfo còn căn lề 16 trước khi vào vùng dữ liệu */
    dataStart = infoOff + ciSize;
    if (flags & 0x200) dataStart = (dataStart + 15) & ~15;
  }

  const idv = new DataView(info.buffer, info.byteOffset, info.byteLength);
  let q = 16;
  const nB = idv.getUint32(q, false); q += 4;
  const blocks = [];
  for (let i = 0; i < nB; i++){
    blocks.push({ u: idv.getUint32(q,false), c: idv.getUint32(q+4,false), f: idv.getUint16(q+8,false) });
    q += 10;
  }
  const nN = idv.getUint32(q, false); q += 4;
  const nodes = [];
  for (let i = 0; i < nN; i++){
    const off = Number(idv.getBigInt64(q,false)), sz = Number(idv.getBigInt64(q+8,false));
    const nf = idv.getUint32(q+16,false); q += 20;
    let nm = ''; while (info[q]) nm += String.fromCharCode(info[q++]); q++;
    nodes.push({ off, size: sz, flags: nf, name: nm });
  }
  return { fmt, uv, rev, declared, ciSize, uiSize, flags, blocks, nodes,
           dataStart, infoOff, info, headerEnd };
}

function parseSF(cab){
  const dv = new DataView(cab.buffer, cab.byteOffset, cab.byteLength);
  const version = dv.getUint32(8, false);
  if (version !== 22) throw new Error(`SerializedFile phiên bản ${version} — tool hiện chỉ hỗ trợ phiên bản 22. Game đã đổi định dạng, cần cập nhật tool.`);
  const metaSize = dv.getUint32(20, false);
  const fileSize = Number(dv.getBigInt64(24, false));
  const dataOffset = Number(dv.getBigInt64(32, false));

  let p = 48;
  const cstr = () => { let s=''; while (cab[p]) s += String.fromCharCode(cab[p++]); p++; return s; };
  const unityVer = cstr();
  const target = dv.getInt32(p, true); p += 4;
  const hasTT = cab[p]; p += 1;

  const i32 = () => { const v = dv.getInt32(p, true); p += 4; return v; };
  const u32 = () => { const v = dv.getUint32(p, true); p += 4; return v; };

  const tcount = i32();
  const types = [];
  for (let i = 0; i < tcount; i++){
    const cid = i32();
    p += 1;                              // stripped
    p += 2;                              // scriptTypeIndex
    if (cid === 114) p += 16;            // scriptHash
    const th = cab.slice(p, p+16); p += 16;
    let nodes = null, sb = null;
    if (hasTT){
      const nn = i32(), sbs = i32();
      nodes = [];
      for (let k = 0; k < nn; k++){
        const ver = dv.getUint16(p, true);
        const level = cab[p+2], tflags = cab[p+3];
        const to = dv.getUint32(p+4, true), no = dv.getUint32(p+8, true);
        const bsize = dv.getInt32(p+12, true), idx = dv.getInt32(p+16, true), meta = dv.getInt32(p+20, true);
        p += 32;
        nodes.push({ ver, level, tflags, to, no, bsize, idx, meta });
      }
      sb = cab.slice(p, p + sbs); p += sbs;
      const nd = i32(); p += nd * 4;     // typeDependencies
    }
    types.push({ cid, th, nodes, sb });
  }

  const ocount = i32();
  const objs = [];
  for (let i = 0; i < ocount; i++){
    p = a4(p);
    const ent = p;
    const pid = dv.getBigInt64(p, true);
    const off = Number(dv.getBigInt64(p+8, true));
    const size = dv.getUint32(p+16, true);
    const tid = dv.getInt32(p+20, true);
    p += 24;
    objs.push({ pid, off, size, tid, cid: types[tid].cid, ent });
  }
  return { version, metaSize, fileSize, dataOffset, unityVer, target, hasTT, types, objs, cab };
}

function decompressAll(orig, b){
  const parts = [];
  const blockAt = [];
  let pos = b.dataStart, outPos = 0;
  for (const blk of b.blocks){
    const raw = orig.subarray(pos, pos + blk.c);
    const ct = blk.f & 0x3F;
    if (ct !== 0 && ct !== 2 && ct !== 3)
      throw new Error(`Block nén kiểu ${ct} (LZMA/khác) — tool chỉ hỗ trợ LZ4 hoặc lưu thô. Game có thể đã đổi định dạng bundle.`);
    const dec = (ct === 2 || ct === 3) ? lz4dec(raw, blk.u) : raw.slice();
    parts.push(dec);
    blockAt.push({ start: outPos, end: outPos + blk.u, comp: blk.c, ct, srcOff: pos });
    outPos += blk.u; pos += blk.c;
  }
  const data = new Uint8Array(outPos);
  let w = 0;
  for (const p of parts){ data.set(p, w); w += p.length; }
  return { data, blockAt };
}

function findSizePos(u8){
  let p = 0;
  while (u8[p]) p++;               // "UnityFS"
  p++; p += 4;                     // \0 + version
  while (u8[p]) p++; p++;          // unityVersion
  while (u8[p]) p++; p++;          // unityRevision
  return p;
}

function readShaderProps(body){
  const dv = new DataView(body.buffer, body.byteOffset, body.byteLength);
  let p = 0;
  const rd = () => { const v = dv.getInt32(p, true); p += 4; return v; };
  const str = () => {
    const n = rd();
    if (n < 0 || p + n > body.length) throw new Error('chuỗi hỏng trong shader');
    const s = new TextDecoder().decode(body.subarray(p, p + n));
    p = a4(p + n);
    return s;
  };
  str();                                   // Shader.m_Name
  const cnt = rd();
  if (cnt < 0 || cnt > 500) throw new Error(`số property bất thường: ${cnt}`);
  const props = [];
  for (let i = 0; i < cnt; i++){
    const name = str(), desc = str();
    const na = rd();
    if (na < 0 || na > 100) throw new Error('m_Attributes hỏng');
    for (let k = 0; k < na; k++) str();
    const type = rd();
    p += 4;                                // m_Flags
    const valOff = p;
    const val = [dv.getFloat32(p,true), dv.getFloat32(p+4,true),
                 dv.getFloat32(p+8,true), dv.getFloat32(p+12,true)];
    p += 16;
    str();                                 // m_DefTexture.m_DefaultName
    p += 4;                                // m_TexDim
    props.push({ name, desc, type, valOff, val });
  }
  return props;
}

function paintShader(body, opt, short, rows){
  const props = readShaderProps(body);
  const dv = new DataView(body.buffer, body.byteOffset, body.byteLength);
  let n = 0;
  for (const p of props){
    const spec = COLOR_MAP[p.name];
    if (!spec) continue;
    let next;
    if (spec.kind === 'color'){
      const rgb = opt[spec.src];
      const alpha = (p.name === '_XRayColor') ? opt.alpha : p.val[3];
      next = [rgb[0], rgb[1], rgb[2], alpha];
    } else {
      next = [opt.width, p.val[1], p.val[2], p.val[3]];
    }
    const before = spec.kind === 'color' ? rgb2hex(p.val) : p.val[0].toFixed(2);
    const after  = spec.kind === 'color' ? rgb2hex(next)  : next[0].toFixed(2);
    for (let i = 0; i < 4; i++) dv.setFloat32(p.valOff + i*4, next[i], true);
    n++;
    if (rows){
      const sw  = spec.kind === 'color' ? `<span class="swatch" style="background:${before}"></span>` : '';
      const sw2 = spec.kind === 'color' ? `<span class="swatch" style="background:${after}"></span>` : '';
      rows.push([short, p.name, sw + before, sw2 + after]);
    }
  }
  return n;
}

function parseHexCode(text) {
  const clean = String(text || '').replace(/0x/gi, '').replace(/[^0-9a-f]/gi, '');
  if (!clean || clean.length % 2) throw new Error('Cấu hình HEX không hợp lệ.');
  const out = new Uint8Array(clean.length / 2);
  for (let i=0;i<out.length;i++) out[i] = parseInt(clean.slice(i*2,i*2+2),16);
  return out;
}

const COLOR_MAP = {
  _XRayColor:    { kind:'color', src:'xray' },
  _OutLineColor: { kind:'color', src:'line' },
  _OutLineWidth: { kind:'float', src:'width' }
};

/* ═══════════ Import hex vào object theo path ID ═══════════
   - shader mới ngắn hơn hoặc bằng chỗ cũ  → ghi tại chỗ, sửa lại size trong bảng object
   - shader mới dài hơn chỗ cũ               → dời xuống cuối vùng dữ liệu, sửa offset + size
   - all = true: dời TẤT CẢ xuống cuối (các bản sao giống nhau nằm liền kề nên nén rất gọn)
   Sau đó chỉ nén lại các block thực sự thay đổi; dung lượng file luôn bằng file gốc. */
function rebuildWithObjects(orig, b, data0, blockAt, sf, node, repl, limit, mode, all){
  if (b.nodes.length !== 1 || node.off !== 0)
    throw new Error('Bundle có nhiều node — tool chỉ hỗ trợ bundle 1 node.');
  const pad = data0.length - node.size;

  /* 1) dựng lại SerializedFile */
  const old = data0.subarray(0, node.size);
  let extra = 0;
  for (const o of sf.objs){ const nb = repl.get(o.pid); if (nb && (all || nb.length > o.size)) extra += nb.length + 8; }
  const cab = new Uint8Array(node.size + extra);
  cab.set(old);
  const cdv = new DataView(cab.buffer);
  let end = node.size;
  const placed = [];
  for (const o of sf.objs){
    const body = repl.get(o.pid);
    if (!body) continue;
    if (cdv.getBigInt64(o.ent, true) !== o.pid) throw new Error('Lệch bảng object.');
    const abs = sf.dataOffset + o.off;
    let off = o.off, moved = false;
    cab.fill(0, abs, abs + o.size);                       // xoá chỗ cũ
    if (!all && body.length <= o.size){ cab.set(body, abs); }
    else {
      end = (end + 7) & ~7;                               // object căn lề 8
      cab.set(body, end);
      off = end - sf.dataOffset; end += body.length; moved = true;
    }
    cdv.setBigInt64(o.ent + 8, BigInt(off), true);
    cdv.setUint32(o.ent + 16, body.length, true);
    placed.push({ pid: o.pid, from: o.size, to: body.length, moved });
  }
  const cabLen = end;
  cdv.setBigInt64(0x18, BigInt(cabLen), false);           // m_FileSize (big-endian)
  const full = new Uint8Array(cabLen + pad);              // giữ đúng phần đệm cuối block như bản gốc
  full.set(cab.subarray(0, cabLen));

  /* 2) bố cục block mới: giữ các block cũ (trừ block cuối), phần đuôi chia lại */
  const n = b.blocks.length, L = full.length;
  const chunk = Math.max(...b.blocks.map(x => x.u));
  const lastF = b.blocks[n - 1].f;
  const plan = [];
  for (let i = 0; i < n - 1; i++) plan.push({ start: blockAt[i].start, end: blockAt[i].end, src: i });
  for (let pos = blockAt[n - 1].start; pos < L; pos += chunk)
    plan.push({ start: pos, end: Math.min(pos + chunk, L), src: -1 });
  for (const pb of plan){
    pb.reuse = pb.src >= 0 && (() => {
      for (let k = pb.start; k < pb.end; k++) if (full[k] !== data0[k]) return false;
      return true;
    })();
  }

  /* 3) nén các block đã đổi: nhanh trước, nâng dần lên nén sâu nếu cần */
  const encoded = new Map();
  const encode = (i, hi) => {
    const pb = plan[i], raw = full.subarray(pb.start, pb.end);
    const f0 = pb.src >= 0 ? b.blocks[pb.src].f : lastF;
    let comp = raw, flags = f0;
    if ((f0 & 0x3F) !== 0){
      comp = lz4enc(raw, hi);
      const back = lz4dec(comp, raw.length);
      for (let k = 0; k < raw.length; k++)
        if (back[k] !== raw[k]) throw new Error(`Nén lại block ${i} sai ở byte ${k}.`);
      if (comp.length >= raw.length){ comp = raw; flags = f0 & ~0x3F; }
    }
    encoded.set(i, { comp, flags, hi });
  };
  plan.forEach((pb, i) => { if (!pb.reuse) encode(i, false); });

  const atEnd = !!(b.flags & 0x80);
  const headLen = atEnd ? b.dataStart : b.infoOff;
  const assemble = () => {
    const parts = [], blocks = [];
    plan.forEach((pb, i) => {
      if (pb.reuse){
        const bl = b.blocks[pb.src], at = blockAt[pb.src];
        parts.push(orig.subarray(at.srcOff, at.srcOff + bl.c));
        blocks.push({ u: bl.u, c: bl.c, f: bl.f });
      } else {
        const e = encoded.get(i);
        parts.push(e.comp);
        blocks.push({ u: pb.end - pb.start, c: e.comp.length, f: e.flags });
      }
    });
    /* blocksInfo mới: hash + bảng block + node (size cab đã đổi) */
    const nodeBytes = b.nodes.map(nd => 20 + nd.name.length + 1).reduce((a, x) => a + x, 0);
    const info = new Uint8Array(16 + 4 + blocks.length * 10 + 4 + nodeBytes);
    const idv = new DataView(info.buffer);
    info.set(b.info.subarray(0, 16), 0);
    let q = 16;
    idv.setUint32(q, blocks.length, false); q += 4;
    for (const bl of blocks){
      idv.setUint32(q, bl.u, false); idv.setUint32(q + 4, bl.c, false); idv.setUint16(q + 8, bl.f, false); q += 10;
    }
    idv.setUint32(q, b.nodes.length, false); q += 4;
    for (const nd of b.nodes){
      idv.setBigInt64(q, BigInt(nd.off), false);
      idv.setBigInt64(q + 8, BigInt(cabLen), false);
      idv.setUint32(q + 16, nd.flags, false); q += 20;
      for (let k = 0; k < nd.name.length; k++) info[q++] = nd.name.charCodeAt(k);
      info[q++] = 0;
    }
    const infoOut = ((b.flags & 0x3F) === 0) ? info : lz4enc(info, true);
    const dataLen = parts.reduce((a, x) => a + x.length, 0);
    let core = headLen + dataLen + infoOut.length;
    if (!atEnd && (b.flags & 0x200)) core = ((headLen + infoOut.length + 15) & ~15) + dataLen;
    return { parts, info, infoOut, core };
  };

  let asm = assemble();
  const cap = limit ?? orig.length;
  if (asm.core > cap && mode !== 'fast'){
    const order = [...encoded.keys()].filter(i => (plan[i].src >= 0 ? b.blocks[plan[i].src].f : lastF) & 0x3F)
      .sort((x, y) => encoded.get(y).comp.length - encoded.get(x).comp.length);
    for (const i of order){
      encode(i, true);
      asm = assemble();
      if (asm.core <= cap) break;
    }
  }
  const { parts, info, infoOut, core } = asm;
  if (core > cap){
    const er = new Error(`Không đủ chỗ: file mới lớn hơn file gốc ${(core - cap).toLocaleString('vi-VN')} byte.`);
    er.overflow = core - cap;
    throw er;
  }

  /* 4) ghép file: phần còn dư cuối file là số 0 để dung lượng bằng file gốc */
  const out = new Uint8Array(orig.length);
  if (atEnd){
    out.set(orig.subarray(0, headLen), 0);
    let p = headLen;
    for (const x of parts){ out.set(x, p); p += x.length; }
    out.set(infoOut, p);
  } else {
    out.set(orig.subarray(0, b.infoOff), 0);
    out.set(infoOut, b.infoOff);
    let p = b.infoOff + infoOut.length;
    if (b.flags & 0x200) p = (p + 15) & ~15;
    for (const x of parts){ out.set(x, p); p += x.length; }
  }
  const sp = findSizePos(out);
  const odv = new DataView(out.buffer);
  odv.setBigInt64(sp, BigInt(atEnd ? core : out.length), false);
  odv.setUint32(sp + 8, infoOut.length, false);          // ciSize
  odv.setUint32(sp + 12, info.length, false);            // uiSize

  /* 5) tự kiểm tra: mở lại file vừa dựng, so từng byte, đọc lại từng object */
  if (out.length !== orig.length) throw new Error('Dung lượng đầu ra khác file gốc.');
  const b2 = parseBundle(out);
  const chk = decompressAll(out, b2).data;
  if (chk.length !== full.length) throw new Error('Tự kiểm tra: độ dài dữ liệu lệch.');
  for (let k = 0; k < full.length; k++)
    if (chk[k] !== full[k]) throw new Error(`Tự kiểm tra: lệch byte ${k}.`);
  const sf2 = parseSF(chk.subarray(0, cabLen));
  if (sf2.fileSize !== cabLen) throw new Error('Tự kiểm tra: m_FileSize sai.');
  if (sf2.objs.length !== sf.objs.length) throw new Error('Tự kiểm tra: số object lệch.');
  const m2 = new Map(sf2.objs.map(o => [o.pid, o]));
  for (const o of sf.objs){
    const o2 = m2.get(o.pid);
    if (!o2) throw new Error(`Tự kiểm tra: mất object ${o.pid}.`);
    const want = repl.get(o.pid) || old.subarray(sf.dataOffset + o.off, sf.dataOffset + o.off + o.size);
    const got = chk.subarray(sf2.dataOffset + o2.off, sf2.dataOffset + o2.off + o2.size);
    if (got.length !== want.length) throw new Error(`Tự kiểm tra: object ${o.pid} sai kích thước.`);
    for (let k = 0; k < want.length; k++)
      if (got[k] !== want[k]) throw new Error(`Tự kiểm tra: object ${o.pid} sai nội dung.`);
  }
  return { out, placed, slack: orig.length - core, all: !!all };
}

/* Thay shader theo path ID bằng hex ADR 2 lớp và ghi màu */
function swapShaders(orig, b, ids, opt){
  const node = b.nodes[0];
  if (!node) throw new Error('Bundle không có node dữ liệu.');
  const { data, blockAt } = decompressAll(orig, b);
  const sf = parseSF(data.subarray(0, node.size));
  const adr = parseHexCode(ADR_HEX);
  const want = new Set(ids);
  const byPid = new Map(sf.objs.map(o => [o.pid.toString(), o]));
  const missing = ids.filter(id => !byPid.has(id));
  const targets = ids.map(id => byPid.get(id)).filter(o => o && o.cid === 48);
  const notShader = ids.filter(id => byPid.has(id) && byPid.get(id).cid !== 48);
  if (!targets.length) throw new Error('Không tìm thấy path ID shader nào trong file này. Đây có phải file shaders của game không?');

  const repl = new Map(), rows = [];
  let painted = 0;
  targets.forEach((o, i) => {
    const body = adr.slice();
    const n = paintShader(body, opt, 'shader', i === 0 ? rows : null);
    if (!n) throw new Error('Không ghi được màu vào shader ADR (hex lỗi?).');
    painted += n;
    repl.set(o.pid, body);
  });
  let r;
  try { r = rebuildWithObjects(orig, b, data, blockAt, sf, node, repl, opt.limit, 'fast', false); }
  catch (e) {
    if (!e.overflow) throw e;
    /* tại chỗ không đủ chỗ → dời tất cả xuống cuối để nén gọn hơn */
    r = rebuildWithObjects(orig, b, data, blockAt, sf, node, repl, opt.limit, undefined, true);
  }
  return { ...r, rows, painted, found: targets.length, total: ids.length, missing, notShader, adrLen: adr.length };
}

/* Đọc nhanh file khi vừa chọn: nền tảng, số path ID tìm thấy, bao nhiêu shader cần dời */
function inspectBundle(orig, b){
  const node = b.nodes[0];
  if (!node) throw new Error('Bundle không có node dữ liệu.');
  const { data } = decompressAll(orig, b);
  const sf = parseSF(data.subarray(0, node.size));
  const fmt = n => n.toLocaleString('vi-VN');
  const plat = sf.target === 13 ? 'Android' : sf.target === 9 ? 'iOS' : `target ${sf.target}`;
  const adrLen = ADR_HEX.length / 2;
  const byPid = new Map(sf.objs.map(o => [o.pid.toString(), o]));
  const stat = ids => {
    const f = ids.map(i => byPid.get(i)).filter(Boolean);
    return { found: f.length, moved: f.filter(o => o.size < adrLen).length, bad: f.filter(o => o.cid !== 48).length };
  };
  const g = stat(GUN_IDS), c = stat(CHAR_IDS);
  const warn = [];
  if (g.found < GUN_IDS.length) warn.push(`súng thiếu ${GUN_IDS.length - g.found} path ID`);
  if (c.found < CHAR_IDS.length) warn.push(`nhân vật thiếu ${CHAR_IDS.length - c.found} path ID`);
  if (g.bad || c.bad) warn.push('có path ID không phải shader');
  if (sf.target !== 13) warn.push('đây không phải file Android');
  let html = `<div class="msg ok">File sẵn sàng — <b>${plat}</b>, ${fmt(sf.objs.length)} object, ${fmt(orig.length)} byte.<br>` +
    `Súng: tìm thấy <b>${g.found}/${GUN_IDS.length}</b> path ID (${g.moved} shader nhỏ hơn hex sẽ dời cuối vùng dữ liệu).<br>` +
    `Nhân vật: tìm thấy <b>${c.found}/${CHAR_IDS.length}</b> path ID (${c.moved} shader nhỏ hơn hex sẽ dời cuối vùng dữ liệu).</div>`;
  if (warn.length) html += `<div class="msg warn">Lưu ý: ${warn.map(esc).join('; ')}.</div>`;
  return html;
}

/* ═══════════ Giao diện ═══════════ */
let FILE = null, ORIG = null, BUN = null;
const hexValue = id => hex2rgb(el(id).value) || [0, 0, 0];
const normHex = v => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); return m ? '#' + m[1].toUpperCase() : null; };

function bindPair(cid, tid){
  const c = el(cid), t = el(tid);
  c.addEventListener('input', () => { t.value = c.value.toUpperCase(); t.classList.remove('bad'); });
  t.addEventListener('input', () => {
    const h = normHex(t.value);
    if (!h){ t.classList.add('bad'); return; }
    t.classList.remove('bad'); c.value = h.toLowerCase();
  });
  t.addEventListener('blur', () => { t.value = c.value.toUpperCase(); t.classList.remove('bad'); });
}
function bindRange(id, outId, digits){
  const r = el(id); r.addEventListener('input', () => { el(outId).textContent = Number(r.value).toFixed(digits); });
}
for (const [c, t] of [['gXray','tgXray'],['gLine','tgLine'],['cXray','tcXray'],['cLine','tcLine']]) bindPair(c, t);
bindRange('gWidth','gwVal',1); bindRange('gAlpha','gaVal',2); bindRange('cWidth','cwVal',1); bindRange('cAlpha','caVal',2);

function setMode(m){
  el('gunPanel').classList.toggle('hidden', m !== 'gun');
  el('characterPanel').classList.toggle('hidden', m !== 'character');
  document.querySelectorAll('.mode').forEach(x => x.classList.toggle('active', x.querySelector('input').value === m));
}
document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', () => setMode(r.value)));

function options(mode){
  const p = mode === 'gun' ? ['gXray','gLine','gWidth','gAlpha'] : ['cXray','cLine','cWidth','cAlpha'];
  return { xray: hexValue(p[0]), line: hexValue(p[1]), width: Number(el(p[2]).value), alpha: Number(el(p[3]).value) };
}

el('file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  FILE = f; ORIG = null; BUN = null; el('go').disabled = true;
  show('info', '<div class="msg warn">Đang kiểm tra file…</div>'); show('out', '');
  try {
    ORIG = new Uint8Array(await f.arrayBuffer());
    BUN = parseBundle(ORIG);
    el('fileName').textContent = `${f.name} — ${ORIG.length.toLocaleString('vi-VN')} byte`;
    show('info', inspectBundle(ORIG, BUN));
    el('go').disabled = false;
  } catch (err) {
    console.error(err);
    el('fileName').textContent = f.name;
    show('info', '<div class="msg bad">Không thể xử lý file: ' + esc(err.message || err) + '</div>');
  }
});

el('go').addEventListener('click', async () => {
  const btn = el('go'); btn.disabled = true; btn.textContent = 'Đang xử lý…';
  await new Promise(r => setTimeout(r, 30));          // cho giao diện kịp hiện trạng thái
  try {
    if (!ORIG || !BUN) throw new Error('Chưa chọn file.');
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const ids = mode === 'gun' ? GUN_IDS : CHAR_IDS;
    const opt = options(mode);
    const r = swapShaders(ORIG, BUN, ids, opt);
    if (r.out.length !== ORIG.length) throw new Error(`Dung lượng lệch: gốc ${ORIG.length} ≠ mới ${r.out.length}.`);
    const fmt = n => n.toLocaleString('vi-VN');
    const moved = r.placed.filter(p => p.moved).length;
    let note = `Đã import hex 2 lớp ADR vào <b>${r.found}/${r.total}</b> shader (${r.found - moved} ghi tại chỗ, ${moved} dời cuối vùng dữ liệu).` +
               `<br>Dung lượng: gốc <b>${fmt(ORIG.length)}</b> = mới <b>${fmt(r.out.length)}</b> byte ✓`;
    if (r.missing.length) note += `<br><b>Lưu ý:</b> không thấy ${r.missing.length} path ID trong file.`;
    if (r.notShader.length) note += `<br><b>Lưu ý:</b> ${r.notShader.length} path ID không phải shader nên bỏ qua.`;
    const sw = h => `<span class="swatch" style="background:${h}"></span>${h}`;
    const rows = [
      ['Lớp 1 — màu (_XRayColor)', sw(rgb2hex([...opt.xray, 1])), opt.alpha.toFixed(2)],
      ['Lớp 2 — màu viền (_OutLineColor)', sw(rgb2hex([...opt.line, 1])), '—'],
      ['Độ dày viền (_OutLineWidth)', opt.width.toFixed(2), '—']
    ];
    const detail = r.placed.map(p => `<tr><td>${p.pid}</td><td>${fmt(p.from)} → ${fmt(p.to)}</td><td>${p.moved ? 'dời cuối' : 'tại chỗ'}</td></tr>`).join('');
    show('out', `<section class="panel"><div class="msg ok res-note">${note}</div>
      <div class="hexwrap"><table class="hex"><tr><th>Thuộc tính</th><th>Giá trị</th><th>Độ mạnh</th></tr>${rows.map(x => '<tr>' + x.map(c => `<td>${c}</td>`).join('') + '</tr>').join('')}</table></div>
      <details style="margin-top:12px"><summary>Chi tiết path ID (${r.placed.length})</summary><div class="hexwrap"><table class="hex"><tr><th>Path ID</th><th>Kích thước</th><th>Vị trí</th></tr>${detail}</table></div></details>
      <button id="dl" style="margin-top:14px">Tải file</button></section>`);
    el('dl').onclick = () => {
      const u = URL.createObjectURL(new Blob([r.out], { type: 'application/octet-stream' })), a = document.createElement('a');
      a.href = u; a.download = FILE.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 1000);
    };
  } catch (err) {
    console.error('Processing failed:', err);
    show('out', '<div class="msg bad">Không thể hoàn tất: ' + esc(err.message || err) + '</div>');
  } finally {
    btn.disabled = false; btn.textContent = 'Tạo file';
  }
});

</script>
</body>
</html>
